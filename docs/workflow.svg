<text x="292" y="680.0" font-size="13" fill="#64748b">at a time, then hardened</text>
<rect x="664" y="617.0" width="552" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="676" y="641.0" font-size="15" font-weight="700" fill="#713f12">sign-off marker gate</text><rect x="1133.2" y="626.0" width="70.8" height="17" rx="8.5" fill="#b91c1c"/><text x="1168.6" y="633.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".06em" fill="#ffffff">BLOCKING</text><text x="676" y="656.0" font-size="13" fill="#713f12">file must end with &#8220;DESIGN-REVIEW: PASS&#8221; &#8212; otherwise the artifact counts as</text><text x="676" y="674.0" font-size="13" fill="#713f12">partial and blocks archiving; design deviations un-gate this review</text>
