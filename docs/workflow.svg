<title id="t">Givn change lifecycle: proposal to archive</title>
<desc id="d">Swimlane view: one lane per artifact, blue steps create, grey cards are artifacts, yellow cards are blocking or advisory checks, ending in merge into the permanent specs.</desc>
<rect width="1240" height="1550" fill="#ffffff"/>
<g font-family="'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif">
<text x="24" y="50" font-size="24" font-weight="800" fill="#0f172a">
givn &#8212; change lifecycle: proposal to archive</text>
<text x="24" y="74" font-size="14" fill="#64748b">One lane per artifact. Every check blocks unless tagged ADVISORY. Between gates the order is</text>
<text x="24" y="93" font-size="14" fill="#64748b">advisory only &#8212; enforcement concentrates at the three chokepoints listed below.</text>
