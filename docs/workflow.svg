<svg xmlns="http://www.w3.org/2000/svg" width="830" height="2146" viewBox="0 0 830 2146" role="img" aria-labelledby="t d">
<title id="t">Givn change lifecycle: proposal to archive</title>
<desc id="d">Top-to-bottom flow: each action pill creates the artifact shown to its right; check cards between the actions gate the transition. Advisory checks never block; every other check must pass before the next action starts.</desc>
<rect width="830" height="2146" fill="#ffffff"/>
<g font-family="'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif">
<text x="20" y="50" font-size="24" font-weight="800" fill="#0f172a">
givn &#8212; change lifecycle: proposal to archive</text>
<text x="20" y="74" font-size="14" fill="#64748b">One action per row, the artifact it creates to its right. Every check between rows</text>
<text x="20" y="93" font-size="14" fill="#64748b">blocks unless tagged ADVISORY.</text>
