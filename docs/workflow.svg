<rect x="664" y="366.0" width="552" height="81" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/><text x="676" y="390.0" font-size="15" font-weight="700" fill="#713f12">givn lint</text><rect x="1133.2" y="375.0" width="70.8" height="17" rx="8.5" fill="#d97706"/><text x="1168.6" y="382.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".06em" fill="#ffffff">ADVISORY</text><text x="676" y="405.0" font-size="13" fill="#713f12">syntax &#183; @wip tags &#183; overlap warnings (severity-ranked exit code)</text><text x="676" y="424.0" font-size="12.5" font-weight="600" fill="#dc2626">&#8617; runs again as a blocking built-in hook at every gate</text>
