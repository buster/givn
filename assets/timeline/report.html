<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Development report</title>
<style>
  /* One self-contained file: inline CSS, inline script, inline SVG, and the
     tokens of docs/design/design-system.md carried inline. No CDN, no
     third-party JavaScript, no build step, and no network access of any kind.
     The generator fills two markers below, each once, and nothing else:
     the view marker in the body — the model rendered as the page's own text,
     so the written file is readable without script — and the single JSON data
     slot inside the report-model element. The inline script then builds the
     interactive axis on top of that text view, from the same model. */
  :root {
    --color-surface: #ffffff;
    --color-surface-raised: #f5f6f8;
    --color-border: #d5d9e0;
    --color-text: #14171c;
    --color-text-muted: #5a6270;
    --color-accent: #2f6fd0;
    --color-ok: #1f7a4d;
    --color-warn: #9a6100;
    --color-error: #b3261e;
    --color-band-command: #6b7bd6;
    --color-band-step: #2f9e8f;
    --color-band-agent: #b06ad0;
    --color-band-wait: #d08a2f;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --font-12: 12px;
    --font-14: 14px;
    --font-16: 16px;
    --font-20: 20px;
    --font-28: 28px;
    --radius-span: 4px;
    --radius-panel: 8px;
    --elevation-panel: 0 1px 2px rgba(20, 23, 28, .08), 0 8px 24px rgba(20, 23, 28, .12);
    --motion: 120ms ease-out;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-surface);
    color: var(--color-text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--font-16);
    line-height: 1.45;
  }
  header { padding: var(--space-4) var(--space-4) 0; }
  main { padding: var(--space-3) var(--space-4) var(--space-4); }
  h1 { font-size: var(--font-28); margin: 0 0 var(--space-2); }
  h2 { font-size: var(--font-20); margin: var(--space-5) 0 var(--space-2); }
  .report-scope { color: var(--color-text-muted); margin: 0 0 var(--space-4); }
  .summary { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-start; }
  .summary > h2, .summary > ol, .summary > p { flex-basis: 100%; margin: 0; }
  .summary > * + * { margin-top: 0; }
  .tile {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-3);
    min-width: 8rem;
  }
  .tile-label { color: var(--color-text-muted); font-size: var(--font-12); }
  .tile-value { font-size: var(--font-20); font-variant-numeric: tabular-nums; }
  .tile-note, .summary-note { color: var(--color-warn); font-size: var(--font-12); }
  .summary-note { flex-basis: 100%; }
  .empty-state {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-4);
    max-width: 42rem;
    padding: var(--space-5);
  }
  .empty-state > h2 { margin: 0; }
  .empty-state > p { color: var(--color-text-muted); margin: 0; }
  .empty-state-back > a { color: var(--color-accent); }
  .longest-steps { list-style: none; padding: 0; }
  .longest-steps li {
    border-bottom: 1px solid var(--color-border);
    display: flex;
    gap: var(--space-3);
    justify-content: space-between;
    padding: var(--space-2) 0;
  }
  .step-label { color: var(--color-text); }
  .step-duration { color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .details {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    box-shadow: var(--elevation-panel);
    margin: var(--space-4) var(--space-4) var(--space-5);
    padding: var(--space-4);
  }
  .details[hidden] { display: none; }
  .details-close {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-span);
    color: var(--color-text);
    font: inherit;
    font-size: var(--font-14);
    padding: var(--space-1) var(--space-3);
  }
  .details-facts { display: grid; grid-template-columns: minmax(6rem, auto) 1fr; gap: var(--space-1) var(--space-3); margin: var(--space-3) 0 0; }
  .details-facts dt { color: var(--color-text-muted); font-size: var(--font-12); }
  .details-facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .timeline-section { margin-top: var(--space-5); }
  .controls { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-2) 0 var(--space-3); }
  .control {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-span);
    color: var(--color-text);
    font: inherit;
    font-size: var(--font-14);
    padding: var(--space-1) var(--space-3);
  }
  .control:disabled { color: var(--color-text-muted); }
  .control:focus-visible, .details-close:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .range { color: var(--color-text-muted); font-size: var(--font-12); font-variant-numeric: tabular-nums; margin: 0; }
  .timeline { display: block; width: 100%; height: auto; transform-origin: left center; }
  /* The report's zoom transition: the token's duration, applied to the axis
     whenever the visible range changes. The reduce block below removes it
     entirely, which is what makes a zoom apply instantly. */
  .timeline.zooming { animation: report-zoom var(--motion); }
  @keyframes report-zoom {
    from { transform: scaleX(.985); }
    to { transform: scaleX(1); }
  }
  .band-row { fill: var(--color-surface-raised); stroke: var(--color-border); }
  .tick { fill: var(--color-text-muted); font-size: var(--font-12); font-variant-numeric: tabular-nums; }
  .band-label { fill: var(--color-text-muted); font-size: var(--font-12); }
  .band-phases { fill: var(--color-text-muted); font-size: var(--font-12); }
  .band[data-band-kind="change"] .span-bar { fill: var(--color-band-command); }
  .band[data-band-kind="ideation"] .span-bar { fill: var(--color-band-agent); }
  .band[data-band-kind="project"] .span-bar { fill: var(--color-band-step); }
  .span { cursor: pointer; }
  .span-bar { fill: var(--color-band-step); rx: var(--radius-span); stroke: transparent; stroke-width: 0; transition: stroke var(--motion); }
  .span:focus-visible .span-bar, .span.selected .span-bar { stroke: var(--color-accent); stroke-width: 2; }
  .span-label { fill: var(--color-text); font-size: var(--font-12); pointer-events: none; }
  .aggregate-bar { fill: var(--color-band-step); opacity: .8; rx: var(--radius-span); }
  .band[data-band-kind="change"] .aggregate-bar { fill: var(--color-band-command); }
  .band[data-band-kind="ideation"] .aggregate-bar { fill: var(--color-band-agent); }
  .band[data-band-kind="project"] .aggregate-bar { fill: var(--color-band-step); }
  .aggregate-label { fill: var(--color-text-muted); font-size: var(--font-12); }
  /* Two columns from 720px: the summary beside the timeline. The desktop
     viewport (1200px and above) puts the open details panel on the right. */
  @media (max-width: 719px) {
    /* Mobile (the 360x780 contract viewport): one column, with the band rows on
       a horizontally scrollable time axis instead of a squeezed one. */
    .timeline-section { overflow-x: auto; }
    .timeline { min-width: 680px; }
  }
  @media (min-width: 720px) {
    main {
      column-gap: var(--space-5);
      display: grid;
      grid-template-columns: minmax(14rem, 20rem) minmax(0, 1fr);
      align-items: start;
    }
    main > .report-scope, main > .empty-state { grid-column: 1 / -1; }
    main > .summary { grid-column: 1; }
    main > .timeline-section { grid-column: 2; margin-top: 0; }
  }
  @media (min-width: 1200px) {
    body:has(#details-panel:not([hidden])) {
      column-gap: var(--space-5);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22rem;
      grid-template-areas: "header header" "main aside";
    }
    body:has(#details-panel:not([hidden])) > header { grid-area: header; }
    body:has(#details-panel:not([hidden])) > main { grid-area: main; }
    body:has(#details-panel:not([hidden])) > aside { grid-area: aside; margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1 id="report-title">Development report</h1>
</header>
<main>
<!--__GIVN_REPORT_VIEW__-->
</main>
<aside class="details" id="details-panel" role="region" aria-label="Details" hidden>
  <h2 class="details-title" id="details-title">Step details</h2>
  <button type="button" class="details-close" id="details-close">Close</button>
  <dl class="details-facts" id="details-facts"></dl>
</aside>
<script id="report-model" type="application/json">/*__GIVN_REPORT_DATA__*/</script>
<script>
/* The report's interactive layer: the timeline axis the browser really drives,
   built from the model the generator embedded above. The axis is derived from
   the record's own timestamps and never from the wall clock, so the same record
   always renders identically; nothing here fetches, loads a remote resource, or
   writes to the record. The empty state carries no timeline at all, so this
   layer does nothing there: no axis, no controls. */
(() => {
  "use strict";

  const SVG = "http://www.w3.org/2000/svg";
  const modelElement = document.getElementById("report-model");
  const timeline = document.querySelector("svg.timeline");
  if (!modelElement || !timeline) return;
  const model = JSON.parse(modelElement.textContent);
  if (!model || model.empty) return;

  /* The axis geometry, in the SVG's own units — the same contract the
     generator's text view draws with. */
  const GEOMETRY = {
    width: 1000,
    gutter: 12,
    labelWidth: 168,
    margin: 8,
    drawingWidth: 1000 - 168 - 8,
    axisHeight: 28,
    bandHeight: 68,
    phaseBaseline: 13,
    minSpan: 2,
    bucketPx: 16,
    maxTicks: 6,
    /* The width one 12-unit character of a span label occupies: the estimate
       that decides whether a label is placeable beside its own bar. */
    charWidth: 6.2,
  };
  /* The round times the axis may mark between two ticks, smallest first. */
  const TICK_STEPS_MS = [
    1_000, 5_000, 15_000, 30_000, 60_000, 300_000, 900_000, 1_800_000,
    3_600_000, 10_800_000, 21_600_000, 43_200_000,
  ];
  /* The zoom's own limits: never narrower than a second, never wider than the
     record's whole range. */
  const MIN_RANGE_MS = 1_000;
  const ZOOM_IN_FACTOR = 0.5;
  const ZOOM_OUT_FACTOR = 2;

  const entries = new Map(model.entries.map((entry) => [entry.id, entry]));
  const stages = new Map(model.stages.map((assignment) => [assignment.entry, assignment.stage]));
  const recorded = model.entries
    .map((entry) => Date.parse(entry.at))
    .filter((value) => Number.isFinite(value));
  /* The record's own range: the bounds every zoom is clamped to, never the wall
     clock. */
  const bounds = { start: Math.min(...recorded), end: Math.max(...recorded) };
  /* The visible window: the record's whole range until a zoom, a pan, or a fit
     moves it through `applyRange`. */
  let range = { start: bounds.start, end: bounds.end };

  /** One SVG element with its attributes — never markup text, so a recorded
      label can never become a node. */
  function element(name, attributes) {
    const node = document.createElementNS(SVG, name);
    for (const key of Object.keys(attributes || {})) {
      const value = attributes[key];
      if (value !== undefined && value !== null) node.setAttribute(key, String(value));
    }
    return node;
  }

  /** One SVG text element carrying its content. */
  function text(content, attributes) {
    const node = element("text", attributes);
    node.textContent = content;
    return node;
  }

  /** One entry's rendered end, in milliseconds, or null where the record's own
      timestamp does not parse. */
  function endOf(entry) {
    const value = Date.parse(entry.at);
    return Number.isFinite(value) ? value : null;
  }

  /** The visible window's scale: the range the reader sees mapped onto the
      drawing width. */
  function scale() {
    return { start: range.start, span: Math.max(1, range.end - range.start) };
  }

  /** One recorded instant's x coordinate inside the visible range. */
  function position(ms) {
    const { start, span } = scale();
    const fraction = (ms - start) / span;
    const left = GEOMETRY.labelWidth;
    const right = GEOMETRY.labelWidth + GEOMETRY.drawingWidth;
    return Math.min(Math.max(left + fraction * GEOMETRY.drawingWidth, left), right);
  }

  /** The time one pixel of the drawing width spends on: the threshold below
      which two entries cannot be told apart. */
  function timePerPixel() {
    return Math.max(1, Math.ceil(scale().span / GEOMETRY.drawingWidth));
  }

  /** One entry's drawn bar: a measured span starts at its recorded end minus its
      duration, an entry the record does not time draws as the narrowest mark. */
  function barOf(entry) {
    const end = endOf(entry);
    if (end === null) return { x: GEOMETRY.labelWidth, width: GEOMETRY.minSpan };
    const start = entry.duration_ms === undefined || entry.duration_ms === null
      ? end
      : end - entry.duration_ms;
    const x = position(start);
    return { x, width: Math.max(position(end) - x, GEOMETRY.minSpan) };
  }

  /** The visible label of one entry: its bounded subject label, or its name. */
  function visibleName(entry) {
    return entry.label === undefined || entry.label === null ? entry.name : entry.label;
  }

  /** One recorded duration as the report renders it — a duration the record
      does not carry is stated, never rendered as a zero. */
  function durationText(entry) {
    const ms = entry.duration_ms;
    if (ms === undefined || ms === null) return "not measured";
    if (ms < 1_000) return ms + " ms";
    if (ms < 60_000) return Math.floor(ms / 1_000) + " s";
    if (ms < 3_600_000) return Math.floor(ms / 60_000) + " m";
    const minutes = Math.floor((ms % 3_600_000) / 60_000);
    return Math.floor(ms / 3_600_000) + " h " + String(minutes).padStart(2, "0") + " m";
  }

  /** One token count as the report renders it, thousands separated. */
  function countText(tokens) {
    return String(tokens).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  /** A recorded instant as the axis reads it: the time of day, from the
      embedded timestamp alone. */
  function clock(ms, seconds) {
    const day = Math.floor(ms / 1_000) % 86_400;
    const hh = String(Math.floor(day / 3_600)).padStart(2, "0");
    const mm = String(Math.floor((day % 3_600) / 60)).padStart(2, "0");
    if (!seconds) return hh + ":" + mm;
    return hh + ":" + mm + ":" + String(day % 60).padStart(2, "0");
  }

  /** The axis's ticks: round instants across the visible range, in time order,
      none of them outside it. */
  function ticks() {
    const { start, span } = scale();
    const end = start + span;
    const step = TICK_STEPS_MS.find((candidate) => span / candidate <= GEOMETRY.maxTicks);
    if (step === undefined) return [];
    const found = [];
    let tick = Math.floor(start / step) * step;
    while (tick <= end && found.length < GEOMETRY.maxTicks) {
      if (tick >= start) found.push(tick);
      tick += step;
    }
    return found;
  }

  /** One row's drawn marks, in the model's own order: a span for every entry
      this window can tell apart, and one aggregate marker per band and time
      bucket for the entries it cannot. */
  function rowMarks(band, perPixel) {
    const drawn = [];
    const buckets = new Map();
    const bucketMs = Math.ceil(perPixel * GEOMETRY.bucketPx);
    for (const id of band.entries) {
      const entry = entries.get(id);
      if (!entry) continue;
      const end = endOf(entry);
      const extent = entry.duration_ms === undefined || entry.duration_ms === null
        ? 0
        : entry.duration_ms;
      if (end === null || extent >= perPixel) {
        drawn.push({ kind: "span", entry, bar: barOf(entry) });
        continue;
      }
      const bucketStart = range.start + Math.floor((end - range.start) / bucketMs) * bucketMs;
      const key = band.scope.kind + ":" + band.scope.id + ":" + bucketStart;
      let marker = buckets.get(key);
      if (marker === undefined) {
        marker = { count: 0, duration: null, bucketStart, bucketEnd: bucketStart + bucketMs, drawn: false };
        buckets.set(key, marker);
      }
      marker.count += 1;
      if (entry.duration_ms !== undefined && entry.duration_ms !== null) {
        marker.duration = (marker.duration || 0) + entry.duration_ms;
      }
      if (marker.drawn) continue;
      marker.drawn = true;
      const x = position(marker.bucketStart);
      drawn.push({
        kind: "aggregate",
        marker,
        bar: { x, width: Math.max(position(marker.bucketEnd) - x, GEOMETRY.minSpan) },
      });
    }
    return drawn;
  }

  /** The inline text one mark carries, and whether it sits beside the bar
      instead of inside it: a span narrower than its label omits the inline
      label — the duration stays where it fits, and the accessible name always
      keeps name and duration. */
  function inlineText(mark, room, name, duration) {
    const full = name + " · " + duration;
    if (mark.bar.width >= full.length * GEOMETRY.charWidth) return { text: full, outside: false };
    if (room >= full.length * GEOMETRY.charWidth) return { text: full, outside: true };
    if (mark.bar.width >= duration.length * GEOMETRY.charWidth) return { text: duration, outside: false };
    return { text: "", outside: false };
  }

  /** One span: the entry drawn on its row's axis, focusable, with its
      accessible name always its name and its duration. */
  function spanNode(mark, room, y) {
    const entry = mark.entry;
    const name = visibleName(entry);
    const duration = durationText(entry);
    const node = element("g", {
      class: "span",
      "data-entry-id": entry.id,
      "data-kind": entry.kind,
      "data-at": entry.at,
      tabindex: 0,
      "aria-label": name + ", " + duration,
    });
    if (entry.duration_ms !== undefined && entry.duration_ms !== null) {
      node.setAttribute("data-duration-ms", entry.duration_ms);
    }
    const stage = stages.get(entry.id);
    if (stage !== undefined && stage !== null) node.setAttribute("data-stage", stage);
    const barY = y + GEOMETRY.bandHeight / 3;
    const inline = inlineText(mark, room, name, duration);
    if (inline.text !== name + " · " + duration) {
      /* Whatever the bar had room to draw, the element's own text still carries
         the step's name and its duration: the SVG title holds both where
         nothing is drawn inline, and the name where only the duration fits. */
      const title = element("title");
      title.textContent = inline.text === "" ? name + " · " + duration : name;
      node.appendChild(title);
    }
    node.appendChild(element("rect", {
      class: "span-bar",
      x: mark.bar.x.toFixed(1),
      y: barY.toFixed(1),
      width: mark.bar.width.toFixed(1),
      height: 16,
    }));
    if (inline.text !== "") {
      const x = inline.outside ? mark.bar.x + mark.bar.width + 4 : mark.bar.x + 4;
      node.appendChild(text(inline.text, {
        class: "span-label",
        x: x.toFixed(1),
        y: (barY + 12).toFixed(1),
      }));
    }
    return node;
  }

  /** One aggregate marker: its bucket's own width, naming how many entries it
      covers and their combined duration, in the same machine-readable
      attributes the text view carries. */
  function aggregateNode(mark, y) {
    const marker = mark.marker;
    const duration = marker.duration === null ? "not measured" : durationText({ duration_ms: marker.duration });
    const covered = marker.count === 1 ? "1 entry" : marker.count + " entries";
    const node = element("g", {
      class: "aggregate",
      "data-count": marker.count,
      "data-bucket-start-ms": marker.bucketStart,
      "data-bucket-end-ms": marker.bucketEnd,
      "aria-label": covered + ", " + duration,
    });
    if (marker.duration !== null) node.setAttribute("data-duration-ms", marker.duration);
    const barY = y + GEOMETRY.bandHeight / 3;
    node.appendChild(element("rect", {
      class: "aggregate-bar",
      x: mark.bar.x.toFixed(1),
      y: barY.toFixed(1),
      width: mark.bar.width.toFixed(1),
      height: 16,
    }));
    /* The marker's inline text follows the same density rule as a span's: the
       count and the combined duration where the bucket has room for them, the
       count alone where it has only that much, nothing where it has neither.
       The accessible name always carries both. */
    const full = marker.count + " · " + duration;
    const count = String(marker.count);
    const inline = mark.bar.width >= full.length * GEOMETRY.charWidth
      ? full
      : mark.bar.width >= count.length * GEOMETRY.charWidth ? count : "";
    if (inline !== "") {
      node.appendChild(text(inline, {
        class: "aggregate-label",
        x: (mark.bar.x + 4).toFixed(1),
        y: (barY + 12).toFixed(1),
      }));
    }
    return node;
  }

  /** One band row: its visible label, its phase names, and its marks. */
  function bandRow(band, y, perPixel) {
    const row = element("g", {
      class: "band",
      "data-band-kind": band.kind,
      "data-band": band.scope.id,
      "aria-label": band.label,
    });
    row.appendChild(element("rect", {
      class: "band-row",
      x: 0,
      y,
      width: GEOMETRY.width,
      height: GEOMETRY.bandHeight,
    }));
    row.appendChild(text(band.label, {
      class: "band-label",
      x: GEOMETRY.gutter,
      y: y + GEOMETRY.bandHeight / 4,
    }));
    if (band.stages && band.stages.length) {
      row.appendChild(text(band.stages.join(" · "), {
        class: "band-phases",
        x: GEOMETRY.labelWidth.toFixed(1),
        y: y + GEOMETRY.phaseBaseline,
      }));
    }
    const marks = rowMarks(band, perPixel);
    const rowEnd = GEOMETRY.labelWidth + GEOMETRY.drawingWidth;
    marks.forEach((mark, index) => {
      const next = marks[index + 1];
      const limit = next === undefined ? rowEnd : next.bar.x;
      const room = limit - (mark.bar.x + mark.bar.width);
      row.appendChild(mark.kind === "span" ? spanNode(mark, room, y) : aggregateNode(mark, y));
    });
    return row;
  }

  /** The whole timeline, for the visible range. */
  function render() {
    while (timeline.firstChild) timeline.removeChild(timeline.firstChild);
    const title = element("title", { id: "timeline-title" });
    title.textContent = "Development timeline";
    timeline.appendChild(title);
    const height = GEOMETRY.axisHeight + model.bands.length * GEOMETRY.bandHeight + GEOMETRY.margin;
    timeline.setAttribute("viewBox", "0 0 " + GEOMETRY.width + " " + height);
    const perPixel = timePerPixel();
    const axis = element("g", { class: "axis", "aria-hidden": "true" });
    for (const tick of ticks()) {
      const label = clock(tick);
      /* A tick's label never runs outside the viewBox: the last tick is
         anchored back so its own text still fits inside the axis. */
      const right = GEOMETRY.width - GEOMETRY.margin - label.length * GEOMETRY.charWidth;
      const x = Math.min(position(tick), right);
      axis.appendChild(text(label, { class: "tick", "data-at-ms": tick, x: x.toFixed(1), y: 16 }));
    }
    timeline.appendChild(axis);
    model.bands.forEach((band, index) => {
      const row = bandRow(band, GEOMETRY.axisHeight + index * GEOMETRY.bandHeight, perPixel);
      if (selected !== null) {
        const span = [...row.querySelectorAll(".span")].find(
          (node) => Number(node.dataset.entryId) === selected,
        );
        if (span) span.classList.add("selected");
      }
      timeline.appendChild(row);
    });
  }

  /* ── The zoom ───────────────────────────────────────────────────────────
     One range-state derivation (`applyRange`) that every path — the buttons,
     the wheel, the drag, and a click on an aggregate marker — goes through, so
     the visible range and its label can never disagree with the drawing. */

  const section = timeline.closest(".timeline-section");
  let controls = null;
  let rangeLabel = null;

  /** The visible range as the zoom control renders it: the times of day the
      window covers, from the embedded timestamps alone. */
  function rangeText() {
    return "Visible range " + clock(range.start, true) + " → " + clock(range.end, true);
  }

  /** One labelled control button. */
  function controlButton(id, label) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "control";
    button.id = id;
    button.textContent = label;
    return button;
  }

  /** The zoom controls and the rendered range label: created only where there is
      a timeline to zoom, so the empty state carries none of them. */
  function buildControls() {
    if (!section) return;
    const group = document.createElement("div");
    group.className = "controls";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Timeline zoom");
    const zoomIn = controlButton("zoom-in", "Zoom in");
    const zoomOut = controlButton("zoom-out", "Zoom out");
    const fit = controlButton("zoom-fit", "Fit");
    zoomIn.addEventListener("click", () => zoom(ZOOM_IN_FACTOR));
    zoomOut.addEventListener("click", () => zoom(ZOOM_OUT_FACTOR));
    fit.addEventListener("click", () => applyRange(bounds));
    group.appendChild(zoomIn);
    group.appendChild(zoomOut);
    group.appendChild(fit);
    rangeLabel = document.createElement("p");
    rangeLabel.className = "range";
    rangeLabel.id = "timeline-range";
    group.appendChild(rangeLabel);
    section.insertBefore(group, timeline);
    controls = { zoomIn, zoomOut, fit };
  }

  /** The label's own state: the rendered range and the controls' limits. A
      control at its limit is disabled, never silently inert. */
  function updateControls() {
    if (rangeLabel) {
      rangeLabel.textContent = rangeText();
      rangeLabel.setAttribute("data-range-start-ms", range.start);
      rangeLabel.setAttribute("data-range-end-ms", range.end);
    }
    if (!controls) return;
    const span = range.end - range.start;
    const whole = bounds.end - bounds.start;
    controls.zoomIn.disabled = span <= MIN_RANGE_MS;
    controls.zoomOut.disabled = span >= whole;
    controls.fit.disabled = span >= whole;
  }

  /** The zoom's own motion: the token's transition applied to the axis, restarted
      on every range change. Under `prefers-reduced-motion: reduce` the style
      sheet removes it entirely, which is what makes the change instant. */
  function pulseZoom() {
    timeline.classList.remove("zooming");
    void timeline.getBoundingClientRect().width;
    timeline.classList.add("zooming");
    window.setTimeout(() => timeline.classList.remove("zooming"), 240);
  }

  /** Set the visible range: the one place a zoom, a pan, or a fit moves the
      axis. The span stays inside the record's own range and above the smallest
      readable window, the window stays inside the record's bounds, and every
      observer of the range (the drawing, the label, the controls) is updated
      here and nowhere else. */
  function applyRange(next) {
    const boundsSpan = Math.max(bounds.end - bounds.start, MIN_RANGE_MS);
    const span = Math.min(Math.max(next.end - next.start, MIN_RANGE_MS), boundsSpan);
    let start = Math.min(Math.max(next.start, bounds.start), bounds.end - span);
    if (start < bounds.start) start = bounds.start;
    range = { start, end: start + span };
    render();
    updateControls();
    pulseZoom();
  }

  /** Zoom the visible range by `factor` (below one zooms in) around `anchor`
      (the range's centre by default), so the anchor's own instant stays where
      the reader put it. */
  function zoom(factor, anchor) {
    const span = range.end - range.start;
    const nextSpan = Math.min(Math.max(span * factor, MIN_RANGE_MS), bounds.end - bounds.start || MIN_RANGE_MS);
    const centre = anchor === undefined ? range.start + span / 2 : anchor;
    const start = centre - (centre - range.start) * (nextSpan / span);
    applyRange({ start, end: start + nextSpan });
  }

  /** The instant one client x coordinate points at, for the wheel and the drag. */
  function instantAt(x) {
    const box = timeline.getBoundingClientRect();
    if (box.width === 0) return range.start;
    const unit = (x - box.left) / box.width * GEOMETRY.width;
    const fraction = (unit - GEOMETRY.labelWidth) / GEOMETRY.drawingWidth;
    return range.start + Math.min(Math.max(fraction, 0), 1) * (range.end - range.start);
  }

  let dragging = null;

  timeline.addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      zoom(event.deltaY < 0 ? ZOOM_IN_FACTOR : ZOOM_OUT_FACTOR, instantAt(event.clientX));
    },
    { passive: false },
  );

  timeline.addEventListener("pointerdown", (event) => {
    dragging = { x: event.clientX, range };
  });

  timeline.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const box = timeline.getBoundingClientRect();
    if (box.width === 0) return;
    const span = dragging.range.end - dragging.range.start;
    const shift = (dragging.x - event.clientX) / box.width * GEOMETRY.width / GEOMETRY.drawingWidth * span;
    applyRange({ start: dragging.range.start + shift, end: dragging.range.end + shift });
  });

  timeline.addEventListener("pointerup", () => {
    dragging = null;
  });
  timeline.addEventListener("pointerleave", () => {
    dragging = null;
  });

  if (section) section.addEventListener("dblclick", () => applyRange(bounds));

  /* ── The details panel ──────────────────────────────────────────────────
     One labelled region, opened by the one selection path the pointer and the
     keyboard both reach, so an opened panel is the same panel however it was
     opened. */

  const panel = document.getElementById("details-panel");
  const facts = document.getElementById("details-facts");
  const closeControl = document.getElementById("details-close");
  let selected = null;

  /** One row of the panel: the fact's written label and its rendered value. */
  function fact(label, value) {
    const term = document.createElement("dt");
    term.textContent = label;
    const definition = document.createElement("dd");
    definition.textContent = value;
    return [term, definition];
  }

  /** The facts the panel shows for one entry: its bounded label, its start, its
      end, its duration, its outcome, and the model and tokens the record
      reports for it. A value the record does not carry is stated as missing,
      never rendered as a zero. */
  function panelFacts(entry) {
    const end = endOf(entry);
    const duration = entry.duration_ms === undefined || entry.duration_ms === null
      ? null
      : entry.duration_ms;
    const start = end === null ? null : end - (duration || 0);
    const data = entry.data === undefined || entry.data === null ? {} : entry.data;
    return [
      ["Label", visibleName(entry)],
      ["Start", start === null ? "not recorded" : clock(start, true)],
      ["End", end === null ? "not recorded" : clock(end, true)],
      ["Duration", durationText(entry)],
      ["Outcome", typeof entry.outcome === "string" ? entry.outcome : "unknown"],
      ["Model", typeof data.model === "string" ? data.model : "not reported"],
      [
        "Tokens",
        typeof data.total_tokens === "number" ? countText(data.total_tokens) : "unavailable",
      ],
    ];
  }

  /** Bring the panel up to date for one entry — the one place the region's
      content is written. */
  function fillPanel(entry) {
    if (!facts) return;
    while (facts.firstChild) facts.removeChild(facts.firstChild);
    for (const [label, value] of panelFacts(entry)) {
      for (const node of fact(label, value)) facts.appendChild(node);
    }
  }

  /** Select one entry: the report's one selection path. The pointer's click and
      the keyboard's `Enter`/`Space` both reach it, and it is the only place the
      panel opens and a span is marked selected. */
  function select(entryId) {
    const entry = entries.get(Number(entryId));
    if (!entry || !panel) return;
    selected = Number(entryId);
    fillPanel(entry);
    panel.hidden = false;
    for (const span of timeline.querySelectorAll(".span")) {
      span.classList.toggle("selected", Number(span.dataset.entryId) === selected);
    }
  }

  /** Close the panel: the close control and `Escape` both reach it. */
  function clearSelection() {
    selected = null;
    if (panel) panel.hidden = true;
    if (facts) {
      while (facts.firstChild) facts.removeChild(facts.firstChild);
    }
    for (const span of timeline.querySelectorAll(".span")) span.classList.remove("selected");
  }

  /** The span one event happened on, wherever inside the span it landed. */
  function spanOf(event) {
    const target = event.target;
    return target && target.closest ? target.closest(".span") : null;
  }

  /** The one activation both the pointer and the keyboard reach: a click and an
      `Enter`/`Space` on a span open the same panel through the same function,
      and a click on an aggregate marker zooms to the bucket it stands for
      instead of pretending to be one entry. */
  function activate(event) {
    const span = spanOf(event);
    if (span) {
      select(span.dataset.entryId);
      return;
    }
    const target = event.target;
    const marker = target && target.closest ? target.closest(".aggregate") : null;
    if (marker) {
      const start = Number(marker.dataset.bucketStartMs);
      const end = Number(marker.dataset.bucketEndMs);
      if (Number.isFinite(start) && Number.isFinite(end)) applyRange({ start, end });
    }
  }

  timeline.addEventListener("click", activate);

  timeline.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
      event.preventDefault();
      activate(event);
    }
  });

  if (closeControl) closeControl.addEventListener("click", clearSelection);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") clearSelection();
  });

  buildControls();
  updateControls();
  render();
})();
</script>
</body>
</html>
