<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Development report</title>
<style>
  /* One self-contained file: inline CSS, inline script, and the tokens of
     docs/design/design-system.md carried inline. No CDN, no third-party
     JavaScript, no build step, and no network access of any kind. The generator
     fills two markers below, each once, and nothing else: the view marker in
     the body — the model rendered as the page's own text, so the written file
     is readable without script — and the single JSON data slot inside the
     report-model element. The inline script builds the hybrid workflow view on
     top of that text view, from the same model, and never reads the wall
     clock. */
  :root {
    --color-surface: #ffffff;
    --color-surface-raised: #f5f6f8;
    --color-surface-warm: #faf8f4;
    --color-border: #d5d9e0;
    --color-text: #14171c;
    --color-text-muted: #5a6270;
    --color-accent: #2f6fd0;
    --color-ok: #1f7a4d;
    --color-warn: #9a6100;
    --color-error: #b3261e;
    --color-done: #1f7a4d;
    --color-active: #9a6100;
    --color-queued: #8b93a1;
    --color-skipped: #5a6270;
    --color-lane-1: #2f6fd0;
    --color-lane-2: #b06ad0;
    --color-lane-3: #2f9e8f;
    --color-lane-4: #d08a2f;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --font-12: 12px;
    --font-14: 14px;
    --font-16: 16px;
    --font-20: 20px;
    --font-28: 28px;
    --radius-span: 4px;
    --radius-panel: 8px;
    --radius-card: 12px;
    --elevation-panel: 0 1px 2px rgba(20, 23, 28, .08), 0 8px 24px rgba(20, 23, 28, .12);
    --motion: 120ms ease-out;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; }
  body {
    margin: 0;
    background: var(--color-surface);
    color: var(--color-text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--font-16);
    line-height: 1.45;
    overflow-x: clip;
  }
  [hidden] { display: none !important; }
  header { padding: var(--space-4) var(--space-4) 0; }
  main { padding: var(--space-3) var(--space-4) var(--space-6); min-width: 0; }
  h1 { font-size: var(--font-28); margin: 0 0 var(--space-2); }
  h2 { font-size: var(--font-20); margin: var(--space-5) 0 var(--space-2); }
  h3 { font-size: var(--font-16); margin: 0 0 var(--space-2); }
  h4 { font-size: var(--font-14); margin: 0 0 var(--space-1); }
  h5 { color: var(--color-text-muted); font-size: var(--font-12); margin: 0 0 var(--space-1); }
  .report-scope { color: var(--color-text-muted); margin: 0 0 var(--space-4); }
  .report-current-state { margin: 0 0 var(--space-4); }
  .summary { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-start; }
  .summary > h2, .summary > ol, .summary > p { flex-basis: 100%; margin: 0; }
  .tile {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-3);
    min-width: 8rem;
  }
  .tile-label { color: var(--color-text-muted); font-size: var(--font-12); }
  .tile-value { font-size: var(--font-20); font-variant-numeric: tabular-nums; }
  .tile-note, .summary-note { color: var(--color-warn); font-size: var(--font-12); }
  .summary-note { flex-basis: 100%; }
  .empty-state {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-4);
    max-width: 42rem;
    padding: var(--space-5);
  }
  .empty-state > h2 { margin: 0; }
  .empty-state > p { color: var(--color-text-muted); margin: 0; }
  .empty-state-back > a { color: var(--color-accent); }
  .longest-steps { list-style: none; padding: 0; margin: 0; }
  .longest-steps li {
    border-bottom: 1px solid var(--color-border);
    display: flex;
    gap: var(--space-3);
    justify-content: space-between;
    padding: var(--space-2) 0;
  }
  .step-label { color: var(--color-text); overflow-wrap: anywhere; }
  .step-kind {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-span);
    color: var(--color-text-muted);
    font-size: var(--font-12);
    padding: 0 var(--space-1);
  }
  .step-duration { color: var(--color-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* ── The hybrid view ─────────────────────────────────────────────────── */
  .hybrid-header {
    border-bottom: 1px solid var(--color-border);
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-3);
  }
  .hybrid-scope { color: var(--color-text-muted); font-size: var(--font-14); margin: 0 0 var(--space-1); }
  .hybrid-current {
    background: #eef4fd;
    border: 1px solid #c9dcf7;
    border-radius: var(--radius-panel);
    color: #163a6b;
    margin: 0 0 var(--space-2);
    padding: var(--space-2) var(--space-3);
  }
  .hybrid-current.is-live { background: #fff8e8; border-color: #f0d9a6; color: #6b4a06; }
  .hybrid-progress { color: var(--color-text-muted); font-size: var(--font-14); margin: 0; }
  .hybrid-progress strong { color: var(--color-text); }
  .kpi-strip {
    display: grid;
    gap: var(--space-2);
    grid-template-columns: repeat(6, minmax(0, 1fr));
    margin-bottom: var(--space-5);
  }
  .kpi {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    padding: var(--space-2) var(--space-3);
  }
  .kpi-label { color: var(--color-text-muted); font-size: var(--font-12); }
  .kpi-value { font-size: var(--font-20); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi-note { color: var(--color-text-muted); font-size: var(--font-12); }
  .section-heading { color: var(--color-text-muted); font-size: var(--font-12); letter-spacing: .1em; margin: var(--space-5) 0 var(--space-2); text-transform: uppercase; }
  /* The linked ideation group: its own labelled section above the change
     workflow, never inside it. Its heading, totals, and progress line state
     the topic's record, not the change's. */
  .group-totals, .group-progress { color: var(--color-text-muted); font-size: var(--font-14); margin: 0 0 var(--space-2); }
  .group-progress strong { color: var(--color-text); }
  .group-empty {
    background: var(--color-surface-raised);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-panel);
    color: var(--color-text-muted);
    font-size: var(--font-14);
    margin: 0 0 var(--space-2);
    padding: var(--space-3);
  }
  .phase-stack { display: flex; flex-direction: column; gap: var(--space-2); position: relative; }
  .phase-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: 0 1px 2px rgba(20, 23, 28, .04);
    min-width: 0;
    overflow: hidden;
  }
  .phase-card[data-status="active"] { border-color: #e8c777; box-shadow: 0 0 0 2px #fdf1d3, 0 1px 2px rgba(20,23,28,.04); }
  .phase-expander {
    align-items: center;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    display: grid;
    font: inherit;
    gap: var(--space-2) var(--space-3);
    grid-template-columns: auto minmax(0, 1fr) auto;
    padding: var(--space-3);
    text-align: left;
    width: 100%;
  }
  .phase-expander:hover { background: var(--color-surface-warm); }
  .phase-expander:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  .phase-knob {
    align-items: center;
    border: 2px solid var(--color-queued);
    border-radius: 50%;
    display: inline-flex;
    font-size: var(--font-12);
    height: 22px;
    justify-content: center;
    width: 22px;
  }
  .phase-card[data-status="done"] .phase-knob { background: var(--color-done); border-color: var(--color-done); color: #fff; }
  .phase-card[data-status="active"] .phase-knob { background: var(--color-active); border-color: var(--color-active); color: #fff; }
  .phase-card[data-status="skipped"] .phase-knob { border-style: dashed; color: var(--color-skipped); }
  .phase-main { min-width: 0; }
  .phase-title { align-items: baseline; display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .phase-name { font-size: var(--font-16); font-weight: 650; }
  .phase-duration { color: var(--color-text-muted); font-size: var(--font-12); font-variant-numeric: tabular-nums; }
  .phase-status {
    border: 1px solid var(--color-border);
    border-radius: 999px;
    color: var(--color-text-muted);
    font-size: var(--font-12);
    margin-left: auto;
    padding: 0 var(--space-2);
    white-space: nowrap;
  }
  .phase-card[data-status="done"] .phase-status { background: #ecf8f1; border-color: #b9e2cb; color: var(--color-done); }
  .phase-card[data-status="active"] .phase-status { background: #fff4d9; border-color: #ecd28e; color: #7a4e00; }
  .phase-card[data-status="skipped"] .phase-status { border-style: dashed; }
  .phase-stats { color: var(--color-text-muted); display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); font-size: var(--font-12); margin-top: 2px; }
  .phase-stats b { color: var(--color-text); font-weight: 600; }
  .phase-lane-names { color: var(--color-text-muted); font-size: var(--font-12); margin-top: 2px; overflow-wrap: anywhere; }
  .phase-chevron { color: var(--color-text-muted); transition: transform var(--motion); }
  .phase-card.is-open .phase-chevron { transform: rotate(90deg); }
  .sparkline { align-items: flex-end; display: flex; gap: 1px; height: 22px; width: 132px; }
  .spark-bar { background: #d6dae1; border-radius: 1px; flex: 1 1 0; min-height: 2px; }
  .spark-bar.is-hot { background: #8b93a1; }
  .phase-region { border-top: 1px solid var(--color-border); padding: var(--space-3); }
  .phase-toolbar {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-bottom: var(--space-2);
  }
  .range-label { color: var(--color-text-muted); font-size: var(--font-12); font-variant-numeric: tabular-nums; margin: 0; }
  .zoom-group { display: flex; gap: var(--space-1); }
  .zoom-control {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-span);
    color: var(--color-text);
    cursor: pointer;
    font: inherit;
    font-size: var(--font-12);
    padding: 2px var(--space-2);
  }
  .zoom-control[aria-pressed="true"] { background: var(--color-text); border-color: var(--color-text); color: #fff; }
  .zoom-control:focus-visible, .lane-header:focus-visible, .tick:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .lane-scroll {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    max-height: 440px;
    max-width: 100%;
    overflow: auto;
    position: relative;
  }
  .timeline-grid { display: flex; min-width: 100%; }
  .phase-axis {
    background: var(--color-surface-warm);
    border-right: 1px solid var(--color-border);
    flex: 0 0 58px;
    position: relative;
  }
  .axis-tick {
    border-top: 1px solid #ece7dc;
    color: var(--color-text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    left: 0;
    padding: 1px 3px;
    position: absolute;
    right: 0;
  }
  .lanes { display: flex; min-width: 0; }
  .lane { border-right: 1px solid var(--color-border); flex: 1 1 0; min-width: 150px; }
  .lane:last-child { border-right: 0; }
  .lane.is-selected { background: #f1f8f4; }
  .lane-header {
    background: var(--color-surface);
    border: 0;
    border-bottom: 1px solid var(--color-border);
    color: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    font: inherit;
    gap: 1px;
    min-height: 46px;
    padding: var(--space-1) var(--space-2);
    text-align: left;
    width: 100%;
  }
  .lane-header:hover { background: var(--color-surface-warm); }
  .lane.is-selected .lane-header { box-shadow: inset 0 -2px 0 var(--color-ok); }
  .lane-name { align-items: center; display: flex; font-size: var(--font-12); font-weight: 620; gap: var(--space-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-swatch { border-radius: 50%; flex: 0 0 7px; height: 7px; width: 7px; }
  .lane-meta { color: var(--color-text-muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-track { position: relative; }
  .tick {
    border: 0;
    border-radius: 3px;
    cursor: pointer;
    font: inherit;
    left: 50%;
    min-width: 10px;
    padding: 0;
    position: absolute;
    transform: translateX(-50%);
  }
  .tick[data-kind="tool"] { background: #63707f; }
  .tick[data-kind="turn"] { background: var(--color-lane-1); }
  .tick[data-kind="revision"] { background: var(--color-lane-2); }
  .tick[data-kind="question"] { background: var(--color-lane-4); }
  .tick[data-kind="subagent"] { background: var(--color-lane-3); }
  .tick[data-outcome="failed"] { background: var(--color-error); }
  .tick.is-repeated { outline: 2px solid #c58a12; }
  .tick.aggregate { background: #a7aeb9; border-radius: 4px; }
  .tick.is-focused { box-shadow: 0 0 0 2px var(--color-accent); }
  .lane-log {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    margin-top: var(--space-3);
    min-width: 0;
    padding: var(--space-3);
  }
  .lane-log-title { margin: 0 0 var(--space-1); }
  .lane-facts {
    display: grid;
    gap: var(--space-1) var(--space-3);
    grid-template-columns: auto minmax(0, 1fr);
    margin: 0 0 var(--space-3);
  }
  .lane-facts dt { color: var(--color-text-muted); font-size: var(--font-12); }
  .lane-facts dd { font-variant-numeric: tabular-nums; margin: 0; overflow-wrap: anywhere; }
  .log-list { list-style: none; margin: 0; max-height: 320px; overflow: auto; padding: 0; }
  .log-entry {
    border-top: 1px solid var(--color-border);
    display: grid;
    gap: var(--space-1) var(--space-2);
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    padding: var(--space-2) 0;
  }
  .log-entry.is-focused { background: #eef4fd; }
  .log-time { color: var(--color-text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .entry-mark { border-radius: 3px; font-size: 10px; padding: 0 var(--space-1); text-transform: uppercase; }
  .entry-mark.failed { background: #fde8e6; color: var(--color-error); }
  .entry-mark.repeated { background: #fdf1d3; color: #7a4e00; }
  .log-label { overflow-wrap: anywhere; }
  .log-duration { color: var(--color-text-muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-facts { display: grid; gap: 0 var(--space-2); grid-column: 3 / -1; grid-template-columns: auto minmax(0, 1fr); margin: var(--space-1) 0 0; }
  .log-facts dt { color: var(--color-text-muted); font-size: 11px; }
  .log-facts dd { font-size: 12px; margin: 0; overflow-wrap: anywhere; }
  .attribution-limit { color: var(--color-warn); font-size: var(--font-12); grid-column: 3 / -1; margin: var(--space-1) 0 0; }
  .content-region { border-top: 1px dashed var(--color-border); grid-column: 3 / -1; margin-top: var(--space-1); padding-top: var(--space-1); }
  .content-field { margin: 0 0 var(--space-2); }
  .content-text {
    background: var(--color-surface-warm);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-span);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    margin: 0;
    max-height: 12rem;
    overflow: auto;
    overflow-wrap: anywhere;
    padding: var(--space-2);
    white-space: pre-wrap;
  }
  .content-meta, .content-omitted { color: var(--color-text-muted); font-size: 11px; margin: var(--space-1) 0 0; }
  .statistics { margin-top: var(--space-5); min-width: 0; }
  .stat-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    min-width: 0;
    padding: var(--space-3);
  }
  .stat-card.wide { grid-column: 1 / -1; }
  .stat-line { border-bottom: 1px dashed var(--color-border); display: grid; gap: var(--space-2); grid-template-columns: minmax(0, 1fr) auto; font-size: var(--font-12); padding: var(--space-1) 0; }
  .stat-line:last-child { border-bottom: 0; }
  .stat-line .value { color: var(--color-text-muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .stat-empty { color: var(--color-text-muted); font-size: var(--font-12); margin: 0; }
  .table-scroll { max-width: 100%; overflow-x: auto; }
  table { border-collapse: collapse; font-size: var(--font-12); width: 100%; }
  th, td { border-bottom: 1px solid var(--color-border); padding: var(--space-1) var(--space-2); text-align: left; white-space: nowrap; }
  th { color: var(--color-text-muted); font-size: 10.5px; text-transform: uppercase; }
  td.number { font-variant-numeric: tabular-nums; text-align: right; }
  tr.is-active td { background: #fff8e8; }
  .token-total { font-size: var(--font-20); font-variant-numeric: tabular-nums; margin-bottom: var(--space-2); }
  /* One column below 720 px: the KPI strip is two columns, the phase cards are
     full width, the expanded phase's lanes scroll horizontally inside the card,
     and the lane log sits below the axis. */
  @media (max-width: 719px) {
    header { padding: var(--space-3) var(--space-3) 0; }
    main { padding: var(--space-2) var(--space-3) var(--space-5); }
    h1 { font-size: var(--font-20); }
    .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-grid { grid-template-columns: minmax(0, 1fr); }
    .stat-card.wide { grid-column: auto; }
    .phase-expander { padding: var(--space-2); }
    .sparkline { width: 100%; }
    .phase-title { gap: var(--space-1); }
    .phase-status { margin-left: 0; }
    .lane-scroll { overflow-x: auto; }
    .lane { flex: 0 0 180px; }
    .log-entry { grid-template-columns: auto auto minmax(0, 1fr); }
    .log-duration { grid-column: 3; }
    .log-facts, .content-region, .attribution-limit { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <h1 id="report-title">Development report</h1>
</header>
<main id="report-main">
<!--__GIVN_REPORT_VIEW__-->
</main>
<script id="report-model" type="application/json">/*__GIVN_REPORT_DATA__*/</script>
<script>
/* The report's interactive layer: the hybrid workflow view the browser really
   drives, built from the model the generator embedded above. Everything is
   derived from the record's own timestamps and the change state embedded at
   generation — never from the wall clock, never from the network — so the same
   record always renders identically. The empty state carries no workflow at
   all, so this layer does nothing there. */
(() => {
  "use strict";

  const main = document.getElementById("report-main");
  const modelElement = document.getElementById("report-model");
  if (!main || !modelElement) return;
  const model = JSON.parse(modelElement.textContent);
  /* One condition for "this report draws the hybrid workflow view": a scope
     with recorded activity and a workflow scaffold. The empty report and the
     project report keep the text view's own markup. */
  if (!model || model.empty) return;
  if (!Array.isArray(model.workflow) || model.workflow.length === 0) return;

  const entries = new Map(model.entries.map((entry) => [entry.id, entry]));
  const entryList = model.entries;
  const stages = model.workflow.map((phase) => phase.stage).filter(Boolean);
  const summary = model.summary || {};
  const omitted = new Set(model.omitted_content || []);
  const phaseState = new Map();
  const LANE_COLORS = ["--color-lane-1", "--color-lane-2", "--color-lane-3", "--color-lane-4"];
  const MAX_LONGEST = 10;
  const MAX_TICKS = 140;
  const TRACK_HEIGHT = 380;
  const AXIS_TICKS = 6;

  /* The text view is the file's own readable fallback; once the interactive
     view is built, the fallback sections step aside so the page reads as one
     hybrid report. They stay in the document (and in the written file). */
  for (const node of main.querySelectorAll(
    ".report-scope, .report-current-state, .summary, .workflow-stack, .timeline-section, section[data-topic]",
  )) {
    node.hidden = true;
  }

  /** One element with its class and text. */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  /** One recorded duration, rendered the same way the text view renders it. */
  function durationText(ms) {
    if (ms === undefined || ms === null) return "not measured";
    if (ms < 1000) return ms + " ms";
    if (ms < 60000) return Math.floor(ms / 1000) + " s";
    if (ms < 3600000) return Math.floor(ms / 60000) + " m";
    const minutes = Math.floor((ms % 3600000) / 60000);
    return Math.floor(ms / 3600000) + " h " + String(minutes).padStart(2, "0") + " m";
  }

  /** A token count, thousands separated. */
  function countText(count) {
    return String(count).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  /** A recorded instant as the report's clock reads it. */
  function clock(ms, seconds) {
    if (ms === undefined || ms === null) return "not recorded";
    const day = Math.floor(ms / 1000) % 86400;
    const hh = String(Math.floor(day / 3600)).padStart(2, "0");
    const mm = String(Math.floor((day % 3600) / 60)).padStart(2, "0");
    if (!seconds) return hh + ":" + mm;
    return hh + ":" + mm + ":" + String(day % 60).padStart(2, "0");
  }

  /** One entry's rendered end, in milliseconds, or null. */
  function endOf(entry) {
    const value = Date.parse(entry.at);
    return Number.isFinite(value) ? value : null;
  }

  /** One entry's visible label. */
  function visibleName(entry) {
    return entry.label === undefined || entry.label === null ? entry.name : entry.label;
  }

  /** One scope, as the header names it. */
  function scopeLabel(scope) {
    if (!scope) return "project report";
    return scope.kind + " " + scope.id;
  }

  /** One phase's recorded bounds; a phase with no recorded entries still
      carries an empty window instead of a guessed duration. */
  function boundsOf(phase) {
    const first = phase.first_ms === undefined || phase.first_ms === null ? null : phase.first_ms;
    const last = phase.last_ms === undefined || phase.last_ms === null ? null : phase.last_ms;
    if (first === null && last === null) return { start: 0, end: 60000 };
    const start = first === null ? last : first;
    const end = last === null ? start : last;
    return { start, end: end > start ? end : start + 1000 };
  }

  /** The visible range for one zoom level: Fit is the phase's whole recorded
      window; 1 h and 15 m narrow it toward the phase's last instant. */
  function rangeFor(phase, level) {
    const bounds = boundsOf(phase);
    if (level === "fit") return bounds;
    const windowMs = level === "60" ? 3600000 : 900000;
    const end = bounds.end;
    const start = Math.max(bounds.start, end - windowMs);
    return { start: start < end ? start : bounds.start, end: end };
  }

  /** One phase's own state: whether it is open, which lane is selected, the zoom
      level, and whether its body has been rendered. The key carries the stack
      the card belongs to, so the change workflow's cards and the linked
      ideation group's cards never share state. */
  function stateOf(stack, phase) {
    const key = phase.stage === undefined || phase.stage === null ? "unstaged" : phase.stage;
    const stateKey = stack.id + ":" + key;
    let state = phaseState.get(stateKey);
    if (!state) {
      state = { open: false, lane: 0, zoom: "fit", focused: null };
      phaseState.set(stateKey, state);
    }
    return state;
  }

  /** The hybrid header: scope, current state, and the done phases of nine. */
  function buildHeader() {
    const header = el("section", "hybrid-header");
    header.appendChild(el("p", "hybrid-scope", scopeLabel(model.scope)));
    const current = el("p", "hybrid-current");
    current.id = "hybrid-current-state";
    const state = model.current_state;
    if (state) {
      current.classList.add("is-live");
      current.appendChild(document.createTextNode("Current state: stage "));
      const stage = el("span", "state-stage", state.stage_label);
      stage.setAttribute("data-stage-label", state.stage_label);
      current.appendChild(stage);
      current.appendChild(document.createTextNode(", phase "));
      current.appendChild(el("span", "state-phase", state.phase === undefined ? "underived" : state.phase));
      current.appendChild(document.createTextNode(", next artifact "));
      current.appendChild(el("span", "state-next", state.next_artifact === undefined ? "none" : state.next_artifact));
      if (state.tasks) {
        current.appendChild(document.createTextNode(", " + state.tasks.done + " of " + state.tasks.total + " tasks done"));
      }
    } else {
      current.textContent = "no live change state";
    }
    header.appendChild(current);
    const done = model.workflow.filter((phase) => phase.status === "done").length;
    const progress = el("p", "hybrid-progress");
    progress.id = "hybrid-phases-done";
    progress.appendChild(el("strong", null, done + " of " + stages.length));
    progress.appendChild(document.createTextNode(" phases done"));
    header.appendChild(progress);
    return header;
  }

  /** One KPI tile with its written label, value, and optional note. */
  function kpi(name, label, value, note) {
    const tile = el("div", "kpi");
    tile.setAttribute("data-kpi", name);
    tile.appendChild(el("span", "kpi-label", label));
    tile.appendChild(el("span", "kpi-value", value));
    if (note) tile.appendChild(el("span", "kpi-note", note));
    return tile;
  }

  /** The six KPI facts: elapsed, active, waiting, tool calls, subagent spans,
      and cost. A fact the record does not carry is stated, never zeroed. */
  function buildKpis() {
    const strip = el("section", "kpi-strip");
    strip.setAttribute("aria-label", "Key figures");
    strip.appendChild(kpi("elapsed", "Elapsed", durationText(summary.elapsed_ms)));
    strip.appendChild(kpi("active", "Active", durationText(summary.active_ms)));
    strip.appendChild(
      kpi(
        "waiting",
        "Waiting",
        durationText(summary.wait_ms),
        (summary.waits || 0) + (summary.waits === 1 ? " wait" : " waits"),
      ),
    );
    strip.appendChild(kpi("tool-calls", "Tool calls", String(summary.tool_calls || 0)));
    strip.appendChild(
      kpi(
        "subagents",
        "Subagent spans",
        String(summary.subagents || 0),
        summary.subagent_ms === undefined || summary.subagent_ms === null
          ? "not measured"
          : durationText(summary.subagent_ms),
      ),
    );
    strip.appendChild(
      kpi(
        "cost",
        "Cost",
        summary.cost_total === undefined || summary.cost_total === null
          ? "unavailable"
          : "$" + summary.cost_total.toFixed(2),
        summary.tokens_total === undefined || summary.tokens_total === null
          ? undefined
          : countText(summary.tokens_total) + " tokens",
      ),
    );
    return strip;
  }

  /** One phase's activity sparkline: its recorded entries bucketed across its
      own recorded window, a fixed number of bars. */
  function sparkline(phase) {
    const bars = el("span", "sparkline");
    bars.setAttribute("aria-hidden", "true");
    const bounds = boundsOf(phase);
    const span = Math.max(1, bounds.end - bounds.start);
    const counts = new Array(22).fill(0);
    for (const lane of phase.lanes || []) {
      for (const id of lane.entries) {
        const entry = entries.get(id);
        const at = entry ? endOf(entry) : null;
        if (at === null) continue;
        const bucket = Math.min(21, Math.max(0, Math.floor(((at - bounds.start) / span) * 22)));
        counts[bucket] += 1;
      }
    }
    const max = Math.max(1, ...counts);
    counts.forEach((count) => {
      const bar = el("span", count / max > 0.55 ? "spark-bar is-hot" : "spark-bar");
      bar.style.height = Math.max(2, Math.round((22 * count) / max)) + "px";
      bars.appendChild(bar);
    });
    return bars;
  }

  /** One phase card's collapsed header facts. */
  function phaseHeading(phase) {
    const stats = el("span", "phase-stats");
    for (const [label, value] of [
      ["wall", durationText(phase.wall_ms)],
      ["active", durationText(phase.active_ms)],
      ["waiting", durationText(phase.waiting_ms)],
      ["tools", String(phase.tools || 0)],
      ["subagents", String(phase.subagents || 0)],
    ]) {
      const bit = el("span");
      bit.appendChild(el("b", null, value));
      bit.appendChild(document.createTextNode(" " + label));
      stats.appendChild(bit);
    }
    const names = (phase.lanes || []).map((lane) => lane.name).join(", ");
    return { stats, lanes: names === "" ? "no recorded lanes" : "lanes: " + names };
  }

  /** One lane's marks across the visible range: individual ticks where the
      density permits, aggregate ticks where entries are too short to tell
      apart — the same threshold at every zoom. */
  function laneMarks(phase, lane, range) {
    const span = Math.max(1, range.end - range.start);
    const perPixel = span / TRACK_HEIGHT;
    const bucketMs = Math.max(1000, perPixel * 12);
    const marks = [];
    const buckets = new Map();
    for (const id of lane.entries) {
      const entry = entries.get(id);
      if (!entry) continue;
      const at = endOf(entry);
      if (at === null) continue;
      const duration = entry.duration_ms === undefined || entry.duration_ms === null ? 0 : entry.duration_ms;
      if (duration >= perPixel * 4) {
        marks.push({ kind: "entry", entry, at, duration });
        continue;
      }
      const bucket = Math.floor((at - range.start) / bucketMs);
      let marker = buckets.get(bucket);
      if (!marker) {
        marker = { kind: "aggregate", count: 0, duration: 0, at: range.start + bucket * bucketMs };
        buckets.set(bucket, marker);
      }
      marker.count += 1;
      marker.duration += duration;
    }
    let combined = marks.concat([...buckets.values()]);
    if (combined.length > MAX_TICKS) {
      const fallback = new Map();
      for (const mark of combined) {
        const bucket = Math.floor((mark.at - range.start) / Math.max(bucketMs, span / MAX_TICKS));
        let marker = fallback.get(bucket);
        if (!marker) {
          marker = { kind: "aggregate", count: 0, duration: 0, at: range.start + bucket * Math.max(bucketMs, span / MAX_TICKS) };
          fallback.set(bucket, marker);
        }
        marker.count += mark.kind === "entry" ? 1 : mark.count;
        marker.duration += mark.kind === "entry" ? mark.duration : mark.duration;
      }
      combined = [...fallback.values()];
    }
    combined.sort((left, right) => left.at - right.at);
    return combined;
  }

  /** The axis labels for the visible range: round instants across the window. */
  function axisTicks(range) {
    const span = Math.max(1, range.end - range.start);
    const ticks = [];
    for (let index = 0; index <= AXIS_TICKS; index += 1) {
      ticks.push({ ms: range.start + (span * index) / AXIS_TICKS, top: (index / AXIS_TICKS) * TRACK_HEIGHT });
    }
    return ticks;
  }

  /** One lane's tick button. A tick is a separate focusable control; the lane
      header is its own button, so no control nests another. */
  function tickNode(stack, phase, lane, mark, range, index) {
    const span = Math.max(1, range.end - range.start);
    const top = Math.min(TRACK_HEIGHT - 2, Math.max(0, ((mark.at - range.start) / span) * TRACK_HEIGHT));
    const button = el("button", "tick");
    button.type = "button";
    button.style.top = top.toFixed(1) + "px";
    let height = 8;
    let label;
    if (mark.kind === "aggregate") {
      button.classList.add("aggregate");
      button.dataset.count = String(mark.count);
      button.dataset.durationMs = String(mark.duration);
      height = Math.max(8, Math.min(TRACK_HEIGHT / 3, (mark.duration / span) * TRACK_HEIGHT));
      label = mark.count + (mark.count === 1 ? " entry" : " entries") + ", " + durationText(mark.duration);
    } else {
      const entry = mark.entry;
      height = Math.max(6, Math.min(TRACK_HEIGHT / 2, (mark.duration / span) * TRACK_HEIGHT));
      button.dataset.entryId = String(entry.id);
      button.dataset.kind = entry.kind;
      button.dataset.outcome = entry.outcome;
      if (phase.repeated && phase.repeated.some((group) => group.entries.includes(entry.id))) {
        button.classList.add("is-repeated");
      }
      button.dataset.durationMs = String(mark.duration);
      label = entry.kind + " " + visibleName(entry) + ", " + durationText(entry.duration_ms);
    }
    button.style.height = height.toFixed(1) + "px";
    button.dataset.index = String(index);
    button.setAttribute("aria-label", label);
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const state = stateOf(stack, phase);
      state.lane = phase.lanes.indexOf(lane);
      state.focused = mark.kind === "entry" ? mark.entry.id : null;
      renderPhase(stack, phase);
    });
    return button;
  }

  /** The phase's vertical axis and its session lanes, side by side. */
  function renderAxis(stack, phase) {
    const state = stateOf(stack, phase);
    const range = rangeFor(phase, state.zoom);
    const scroll = el("div", "lane-scroll");
    const grid = el("div", "timeline-grid");
    const axis = el("div", "phase-axis");
    axis.style.height = (TRACK_HEIGHT + 46) + "px";
    for (const tick of axisTicks(range)) {
      const label = el("div", "axis-tick", clock(tick.ms));
      label.style.top = tick.top.toFixed(1) + "px";
      axis.appendChild(label);
    }
    grid.appendChild(axis);
    const lanes = el("div", "lanes");
    phase.lanes.forEach((lane, laneIndex) => {
      const column = el("div", state.lane === laneIndex ? "lane is-selected" : "lane");
      column.dataset.lane = lane.name;
      const header = el("button", "lane-header");
      header.type = "button";
      header.dataset.lane = lane.name;
      header.setAttribute("aria-pressed", state.lane === laneIndex ? "true" : "false");
      header.setAttribute(
        "aria-label",
        lane.name + ", " + durationText(lane.duration_ms),
      );
      const name = el("span", "lane-name");
      const swatch = el("span", "lane-swatch");
      swatch.style.background = "var(" + LANE_COLORS[laneIndex % LANE_COLORS.length] + ")";
      name.appendChild(swatch);
      name.appendChild(document.createTextNode(lane.name));
      header.appendChild(name);
      header.appendChild(
        el("span", "lane-meta", durationText(lane.duration_ms) + " · " + lane.entries.length + " entries"),
      );
      header.addEventListener("click", () => {
        state.lane = laneIndex;
        state.focused = null;
        renderPhase(stack, phase);
      });
      const track = el("div", "lane-track");
      track.style.height = TRACK_HEIGHT + "px";
      const marks = laneMarks(phase, lane, range);
      marks.forEach((mark, index) =>
        track.appendChild(tickNode(stack, phase, lane, mark, range, index)),
      );
      column.appendChild(header);
      column.appendChild(track);
      lanes.appendChild(column);
    });
    grid.appendChild(lanes);
    scroll.appendChild(grid);
    return scroll;
  }

  /** One entry's lane-log row: its time, marks, label, duration, facts, and —
      where captured — its bounded content region. */
  function logEntryNode(phase, entry) {
    const row = el("li", "log-entry");
    row.dataset.entryId = String(entry.id);
    row.dataset.kind = entry.kind;
    row.appendChild(el("span", "log-time", clock(endOf(entry), true)));
    const marks = el("span");
    if (entry.outcome === "failed") marks.appendChild(el("span", "entry-mark failed", "failed"));
    if (phase.repeated && phase.repeated.some((group) => group.entries.includes(entry.id))) {
      marks.appendChild(el("span", "entry-mark repeated", "repeated"));
    }
    row.appendChild(marks);
    row.appendChild(el("span", "log-label", visibleName(entry)));
    row.appendChild(el("span", "log-duration", durationText(entry.duration_ms)));

    const facts = el("dl", "log-facts");
    const data = entry.data && typeof entry.data === "object" ? entry.data : {};
    const fact = (label, value) => {
      facts.appendChild(el("dt", null, label));
      facts.appendChild(el("dd", null, value === undefined || value === null ? "not reported" : String(value)));
    };
    fact("Kind", entry.kind);
    fact("Outcome", entry.outcome);
    if (entry.session) fact("Session", entry.session);
    if (data.title !== undefined) fact("Session title", data.title);
    if (data.tool_call_id !== undefined) fact("Tool call id", data.tool_call_id);
    if (data.status !== undefined) fact("Status", data.status);
    if (data.stop_reason !== undefined) fact("Stop reason", data.stop_reason);
    if (data.model !== undefined) fact("Model", data.model);
    if (data.cost !== undefined) fact("Cost", typeof data.cost === "object" ? JSON.stringify(data.cost) : data.cost);
    if (data.list_cost !== undefined) fact("List cost", data.list_cost);
    if (data.context_size !== undefined) fact("Context size", data.context_size);
    if (data.context_window !== undefined) fact("Context window", data.context_window);
    if (data.output_bytes !== undefined) fact("Output bytes", data.output_bytes);
    if (data.error !== undefined) fact("Error", data.error);
    if (data.parent !== undefined) fact("Parent", data.parent);
    if (data.agent !== undefined) fact("Agent", data.agent);
    if (data.subagent !== undefined) fact("Subagent", data.subagent);
    if (data.attempt !== undefined) {
      fact(
        "Retry",
        data.max_attempts === undefined ? String(data.attempt) : data.attempt + " of " + data.max_attempts,
      );
    }
    if (data.permission_mode !== undefined) fact("Permission mode", data.permission_mode);
    row.appendChild(facts);

    if (entry.kind === "subagent") {
      const attributable = entryList.some((candidate) => candidate.parent === entry.id && candidate.kind === "tool");
      if (!attributable) {
        row.appendChild(
          el(
            "p",
            "attribution-limit",
            "no tool call was attributable to this subagent span; the record names no per-subagent tool identity for it.",
          ),
        );
      }
    }

    const content = data.content && typeof data.content === "object" ? data.content : null;
    const budgetLeftOut = omitted.has(entry.id);
    if (content) {
      const region = el("section", "content-region");
      region.setAttribute("aria-label", "Captured content");
      region.appendChild(el("h4", null, "Captured content"));
      for (const [name, label] of [
        ["tool_input", "Tool input"],
        ["tool_output", "Tool output"],
        ["assistant_text", "Assistant text"],
        ["thinking_text", "Thinking text"],
        ["user_prompt", "User prompt"],
        ["compaction_summary", "Compaction summary"],
        ["plan_content", "Plan content"],
        ["draft_text", "Draft text"],
        ["subagent_transcript", "Subagent transcript"],
      ]) {
        const field = content[name];
        if (!field || typeof field !== "object" || typeof field.text !== "string") continue;
        const block = el("section", "content-field");
        block.dataset.field = name;
        block.appendChild(el("h5", null, label));
        block.appendChild(el("pre", "content-text", field.text));
        const original = typeof field.bytes === "number" ? field.bytes : null;
        block.appendChild(
          el(
            "p",
            "content-meta",
            "64 KiB per field · " + (field.truncated === true ? "truncated" : "complete")
              + (original === null ? "" : " · original " + original + " bytes"),
          ),
        );
        region.appendChild(block);
      }
      row.appendChild(region);
    } else if (budgetLeftOut) {
      row.appendChild(
        el(
          "p",
          "content-omitted",
          typeof model.content_omitted_note === "string" ? model.content_omitted_note : "content omitted; see the record",
        ),
      );
    }
    return row;
  }

  /** The selected lane's log: the lane's own facts and entries, sorted by the
      recorded instant. */
  function renderLog(stack, phase) {
    const state = stateOf(stack, phase);
    const lane = phase.lanes[state.lane];
    const log = el("section", "lane-log");
    log.id = "lane-log-" + (phase.stage === undefined ? "unstaged" : phase.stage);
    log.setAttribute("aria-label", "Lane log");
    const title = el("h3", "lane-log-title", lane.name + " — log");
    log.appendChild(title);
    const facts = el("dl", "lane-facts");
    const start = lane.first_ms === undefined ? null : lane.first_ms;
    const fact = (label, value) => {
      facts.appendChild(el("dt", null, label));
      facts.appendChild(el("dd", null, value));
    };
    fact("Start", clock(start, true));
    fact("Duration", durationText(lane.duration_ms));
    const selected = lane.entries.map((id) => entries.get(id)).filter(Boolean);
    const failed = selected.some((entry) => entry.outcome === "failed");
    fact("Outcome", failed ? "failed" : (selected[0] && selected[0].outcome) || "unknown");
    log.appendChild(facts);
    const list = el("ol", "log-list");
    const ordered = selected.slice().sort((left, right) => {
      const leftAt = endOf(left);
      const rightAt = endOf(right);
      return (leftAt === null ? 0 : leftAt) - (rightAt === null ? 0 : rightAt);
    });
    for (const entry of ordered) {
      const row = logEntryNode(phase, entry);
      if (state.focused === entry.id) row.classList.add("is-focused");
      list.appendChild(row);
    }
    if (ordered.length === 0) list.appendChild(el("li", "stat-empty", "no recorded entries in this lane"));
    log.appendChild(list);
    return log;
  }

  /** Build (or rebuild) one phase's expanded body: the toolbar with the
      per-phase zoom controls, the vertical axis with its lanes, and the log. */
  function renderPhase(stack, phase) {
    const key = phase.stage === undefined ? "unstaged" : phase.stage;
    const section = document.getElementById(stack.id);
    if (!section) return;
    const card = section.querySelector('.phase-card[data-phase="' + key + '"]');
    if (!card) return;
    const state = stateOf(stack, phase);
    const region = card.querySelector(".phase-region");
    if (!region) return;
    while (region.firstChild) region.removeChild(region.firstChild);
    const toolbar = el("div", "phase-toolbar");
    const range = rangeFor(phase, state.zoom);
    const label = el("p", "range-label");
    label.id = "phase-range-" + key;
    label.dataset.rangeStartMs = String(range.start);
    label.dataset.rangeEndMs = String(range.end);
    label.textContent = "Visible range " + clock(range.start, true) + " → " + clock(range.end, true);
    toolbar.appendChild(label);
    const zoom = el("div", "zoom-group");
    zoom.setAttribute("role", "group");
    zoom.setAttribute("aria-label", "Timeline zoom");
    for (const [level, text] of [["fit", "Fit"], ["60", "1 h"], ["15", "15 m"]]) {
      const button = el("button", "zoom-control", text);
      button.type = "button";
      button.dataset.zoom = level;
      button.setAttribute("aria-pressed", state.zoom === level ? "true" : "false");
      button.addEventListener("click", () => {
        state.zoom = level;
        renderPhase(stack, phase);
      });
      zoom.appendChild(button);
    }
    toolbar.appendChild(zoom);
    region.appendChild(toolbar);
    if (phase.lanes.length === 0) {
      region.appendChild(el("p", "stat-empty", "No recorded lanes in this phase."));
      return;
    }
    region.appendChild(renderAxis(stack, phase));
    region.appendChild(renderLog(stack, phase));
  }

  /** One phase card: the expander button, the labelled region, and the header
      facts. The body is built lazily on first expansion, so the DOM stays
      bounded at every zoom. */
  function phaseCard(stack, phase) {
    const key = phase.stage === undefined || phase.stage === null ? "unstaged" : phase.stage;
    const state = stateOf(stack, phase);
    const card = el("section", "phase-card");
    card.dataset.phase = key;
    card.dataset.status = phase.status === undefined || phase.status === null ? "underived" : phase.status;
    const expander = el("button", "phase-expander");
    expander.type = "button";
    expander.id = "phase-toggle-" + key;
    expander.setAttribute("aria-expanded", "false");
    expander.setAttribute("aria-controls", "phase-region-" + key);
    const knob = el("span", "phase-knob");
    knob.setAttribute("aria-hidden", "true");
    if (phase.status === "done") knob.textContent = "✓";
    if (phase.status === "active") knob.textContent = "●";
    expander.appendChild(knob);
    const main = el("span", "phase-main");
    const title = el("span", "phase-title");
    title.appendChild(el("span", "phase-name", phase.stage === undefined ? "no recorded stage transition" : phase.stage));
    title.appendChild(el("span", "phase-duration", durationText(phase.wall_ms)));
    title.appendChild(el("span", "phase-status", phase.status === undefined ? "underived" : phase.status));
    main.appendChild(title);
    const heading = phaseHeading(phase);
    main.appendChild(heading.stats);
    main.appendChild(el("span", "phase-lane-names", heading.lanes));
    expander.appendChild(main);
    const right = el("span");
    right.appendChild(sparkline(phase));
    right.appendChild(el("span", "phase-chevron", "▸"));
    expander.appendChild(right);
    expander.addEventListener("click", () => {
      state.open = !state.open;
      expander.setAttribute("aria-expanded", state.open ? "true" : "false");
      card.classList.toggle("is-open", state.open);
      region.hidden = !state.open;
      if (state.open) renderPhase(stack, phase);
    });
    card.appendChild(expander);
    const region = el("div", "phase-region");
    region.id = "phase-region-" + key;
    region.setAttribute("role", "region");
    region.setAttribute("aria-labelledby", expander.id);
    region.hidden = true;
    card.appendChild(region);
    return card;
  }

  /** One stack's labelled section: its own heading and the id every scoped
      query inside the stack reads. The change workflow and the linked ideation
      group share it; the container id a stack names is the only difference. */
  function stackSection(stack, className, headingText) {
    const section = el("section", className);
    section.id = stack.id;
    const heading = el("h2", "section-heading", headingText);
    heading.id = stack.id + "-heading";
    section.setAttribute("aria-labelledby", heading.id);
    section.appendChild(heading);
    return section;
  }

  /** One stack's phase cards, top to bottom. */
  function phaseStack(stack, phases) {
    const node = el("div", "phase-stack");
    for (const phase of phases) node.appendChild(phaseCard(stack, phase));
    return node;
  }

  /** The workflow stack: the scope's own workflow phases, top to bottom — the
      change's nine for a change report, the six ideation phases for a topic
      report — plus the group of work the record assigns to no stage. */
  function buildWorkflow() {
    const stack = { id: "hybrid-workflow" };
    const section = stackSection(stack, "hybrid-workflow", "Workflow · top to bottom");
    section.appendChild(phaseStack(stack, model.workflow));
    if (model.unstaged) {
      const unstaged = el("section", "hybrid-unstaged");
      unstaged.id = "hybrid-unstaged";
      const subheading = el("h3", "section-heading", "No recorded stage transition");
      unstaged.appendChild(subheading);
      unstaged.appendChild(phaseCard(stack, model.unstaged));
      section.appendChild(unstaged);
    }
    return section;
  }

  /** The linked ideation group: the topic's six ideation phases with the topic
      report's marker statuses, its own cards, lanes, log, zoom, and totals,
      rendered as its own labelled section above the change workflow — never
      inside it, and never as the change's current phase. A topic whose record
      holds no entry states that instead of inventing phases or durations. */
  function buildIdeationGroup() {
    const group = model.ideation;
    if (!group) return null;
    const stack = { id: "hybrid-ideation" };
    const section = stackSection(stack, "hybrid-ideation", "Linked ideation · " + group.topic);
    section.dataset.topic = group.topic;
    if (!group.activity) {
      section.appendChild(
        el("p", "group-empty", "no recorded activity (pre-dates the record)"),
      );
      return section;
    }
    const totals = el("p", "group-totals");
    totals.id = "hybrid-group-totals";
    totals.dataset.entries = String(group.entries.length);
    totals.textContent =
      "ideation recorded " + durationText(group.duration_ms)
      + ", " + (group.tools || 0) + " tools"
      + ", " + (group.subagents || 0) + " subagents"
      + ", " + (group.waits || 0) + " waits";
    section.appendChild(totals);
    const done = group.phases.filter((phase) => phase.status === "done").length;
    const progress = el("p", "group-progress");
    progress.id = "hybrid-ideation-done";
    progress.appendChild(el("strong", null, done + " of " + group.phases.length));
    progress.appendChild(document.createTextNode(" ideation phases done"));
    section.appendChild(progress);
    section.appendChild(phaseStack(stack, group.phases));
    return section;
  }

  /** One plain statistics line. */
  function statLine(label, value) {
    const line = el("div", "stat-line");
    line.appendChild(el("span", null, label));
    line.appendChild(el("span", "value", value));
    return line;
  }

  /** The statistics: longest steps, question waits, loops and retries, the
      phase table, and tokens. */
  function buildStatistics() {
    const section = el("section", "statistics");
    section.id = "hybrid-statistics";
    const heading = el("h2", "section-heading", "Statistics");
    heading.id = "hybrid-statistics-heading";
    section.setAttribute("aria-labelledby", heading.id);
    section.appendChild(heading);
    const grid = el("div", "stat-grid");

    const longest = el("section", "stat-card");
    longest.id = "hybrid-longest";
    longest.appendChild(el("h3", null, "Longest steps"));
    const list = el("ol", "longest-steps");
    const ranked = (summary.longest_steps || []).slice(0, MAX_LONGEST);
    for (const step of ranked) {
      const row = el("li");
      row.dataset.entryId = String(step.id);
      row.dataset.kind = step.kind;
      row.dataset.durationMs = String(step.duration_ms);
      row.appendChild(el("span", "step-label", step.label));
      row.appendChild(el("span", "step-kind", step.kind));
      row.appendChild(el("span", "step-duration", durationText(step.duration_ms)));
      list.appendChild(row);
    }
    if (ranked.length === 0) list.appendChild(el("li", "stat-empty", "no measured step"));
    longest.appendChild(list);
    grid.appendChild(longest);

    const waits = el("section", "stat-card");
    waits.id = "hybrid-waits";
    waits.appendChild(el("h3", null, "Question waits"));
    const questions = entryList.filter((entry) => entry.kind === "question").slice(0, MAX_LONGEST);
    if (questions.length === 0) waits.appendChild(el("p", "stat-empty", "no recorded waits"));
    for (const question of questions) {
      waits.appendChild(statLine(visibleName(question), durationText(question.duration_ms)));
    }
    grid.appendChild(waits);

    const loops = el("section", "stat-card");
    loops.id = "hybrid-repeats";
    loops.appendChild(el("h3", null, "Loops & retries"));
    const repeated = model.workflow.flatMap((phase) => phase.repeated || []);
    if (repeated.length === 0) loops.appendChild(el("p", "stat-empty", "no repeated groups"));
    for (const group of repeated.slice(0, MAX_LONGEST)) {
      loops.appendChild(statLine(group.label, "× " + group.count + " · " + durationText(group.duration_ms)));
    }
    grid.appendChild(loops);

    const tableCard = el("section", "stat-card wide");
    tableCard.appendChild(el("h3", null, "Phase statistics"));
    const scroll = el("div", "table-scroll");
    const table = el("table");
    const head = el("thead");
    const headRow = el("tr");
    for (const label of ["Phase", "Status", "Wall", "Active", "Waiting", "Tools", "Subagents"]) {
      headRow.appendChild(el("th", null, label));
    }
    head.appendChild(headRow);
    table.appendChild(head);
    const body = el("tbody");
    for (const phase of model.workflow) {
      const row = el("tr");
      if (phase.status === "active") row.className = "is-active";
      row.appendChild(el("td", null, phase.stage === undefined ? "no recorded stage transition" : phase.stage));
      row.appendChild(el("td", null, phase.status === undefined ? "underived" : phase.status));
      for (const value of [
        durationText(phase.wall_ms),
        durationText(phase.active_ms),
        durationText(phase.waiting_ms),
        String(phase.tools || 0),
        String(phase.subagents || 0),
      ]) {
        row.appendChild(el("td", "number", value));
      }
      body.appendChild(row);
    }
    table.appendChild(body);
    scroll.appendChild(table);
    tableCard.appendChild(scroll);
    grid.appendChild(tableCard);

    const tokens = el("section", "stat-card");
    tokens.id = "hybrid-tokens";
    tokens.appendChild(el("h3", null, "Tokens"));
    tokens.appendChild(
      el(
        "p",
        "token-total",
        summary.tokens_total === undefined || summary.tokens_total === null
          ? "unavailable"
          : countText(summary.tokens_total),
      ),
    );
    for (const row of summary.tokens_by_model || []) {
      tokens.appendChild(statLine(row.name, row.tokens === null || row.tokens === undefined ? "unavailable" : countText(row.tokens)));
    }
    grid.appendChild(tokens);

    section.appendChild(grid);
    return section;
  }

  main.appendChild(buildHeader());
  main.appendChild(buildKpis());
  const ideationGroup = buildIdeationGroup();
  if (ideationGroup) main.appendChild(ideationGroup);
  main.appendChild(buildWorkflow());
  main.appendChild(buildStatistics());
})();
</script>
</body>
</html>
