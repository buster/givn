# givn default manifest — embedded in the binary.
# Projects customise via overlay in givn/config.yaml (do not edit this file).
# See arc42 ch.8.2 for the overlay semantics and examples.

artifacts:
  - id: proposal
    generates: ["proposal.md"]
    requires: []
    template: "proposal.md"
    instruction: "proposal"
    optional: false
    post: []

  - id: specs
    generates: ["specs/**/*.feature"]
    requires: ["proposal"]
    template: "spec.feature"
    instruction: "specs"
    optional: false
    post: []

  - id: design
    generates: ["design.md"]
    requires: ["specs"]
    template: "design.md"
    instruction: "design"
    optional: false
    post: []

  - id: design-review
    generates: ["design-review.md"]
    requires: ["design"]
    template: "design-review.md"
    instruction: "design-review"
    optional: false
    post: []

  - id: tasks
    generates: ["tasks.md"]
    requires: ["design-review"]
    template: "tasks.md"
    instruction: "tasks"
    optional: false
    post: []

  - id: review
    generates: ["review.md"]
    requires: ["tasks"]
    template: "review.md"
    instruction: "review"
    optional: false
    post: []

apply:
  requires: ["tasks", "review"]
  tracks: "tasks.md"

verify:
  command: "givn missing-testrunner"
  features_path: "givn/specs"

addons:
  arc42: false

extras: false
