[package]
name = "givn-e2e"
version = "0.0.0"
edition = "2024"
description = "Givn's black-box acceptance package: the @e2e Gherkin corpus driven through the built binary"
publish = false

# A standalone workspace: the package must be its own workspace root so it
# never shares the product's workspace graph, lockfile, or target directory.
[workspace]

# Test-only dependencies. No `givn`, `givn-config`, or `givn-core` entry may
# appear in any table; `tests/e2e_runner.rs` re-reads `Cargo.lock` on every run
# and refuses the package when one appears.
[dev-dependencies]
cucumber = "0.23"
libc = "0.2"
gherkin = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "=0.11.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The harness owns stdout/stderr and the exit status, not libtest: one process
# writes one scoped result file.
[[test]]
name = "e2e_runner"
harness = false
