name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag to reproduce or republish"
        required: true
        type: string

concurrency:
  group: givn-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    outputs:
      validated_sha: ${{ steps.release_identity.outputs.tag_commit }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    runs-on: ubuntu-24.04
    env:
      CRATE_NAME: givn
      PRIMARY_BRANCH: main
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        id: release_identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            printf 'release must run from a version tag, got %s\n' "$RELEASE_REF" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch --force --no-tags origin \
            "$PRIMARY_BRANCH:refs/remotes/origin/$PRIMARY_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf 'release tag is not available locally: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            printf 'release tag must be annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -n "$RELEASE_SHA" && "$tag_commit" != "$RELEASE_SHA" ]]; then
            printf 'tag %s resolves to %s, but GitHub checked out %s\n' \
              "$RELEASE_TAG" "$tag_commit" "$RELEASE_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" \
            "refs/remotes/origin/$PRIMARY_BRANCH"; then
            printf 'tag commit is not reachable from origin/%s\n' "$PRIMARY_BRANCH" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          manifest_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"
          if [[ "$manifest_version" != "$release_version" ]]; then
            printf 'tag version %s does not match Cargo.toml version %s\n' \
              "$release_version" "$manifest_version" >&2
            exit 1
          fi

          lock_version="$(awk '
            /^\[\[package\]\]$/ { in_givn = 0 }
            /^name = "givn"$/ { in_givn = 1; next }
            in_givn && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [[ "$lock_version" != "$release_version" ]]; then
            printf 'tag version %s does not match Cargo.lock version %s\n' \
              "$release_version" "$lock_version" >&2
            exit 1
          fi

          if ! grep -Eq "^## \[$release_version\]($| - )" CHANGELOG.md; then
            printf 'CHANGELOG.md has no release heading for %s\n' "$release_version" >&2
            exit 1
          fi

          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'tag_commit=%s\nrelease_tag=%s\n' \
            "$tag_commit" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@637df09687b2092ca3bdba3f1af641e2806e1356 # nextest

      - name: Run library tests
        run: cargo nextest run --locked --lib --no-tests=warn

      - name: Build release binary
        run: cargo build --locked --release --bin givn

      - name: Verify CLI version
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(target/release/givn --version)"
          expected_output="$CRATE_NAME $RELEASE_VERSION"
          if [[ "$version_output" != "$expected_output" ]]; then
            printf 'givn --version returned %s, expected %s\n' \
              "$version_output" "$expected_output" >&2
            exit 1
          fi

      - name: Run repository acceptance suites
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh
          ./run-tests.sh --e2e

      - name: Install pinned Rust security tools
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo audit --version 2>/dev/null | grep -Fq 'cargo-audit-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          if ! cargo deny --version 2>/dev/null | grep -Fq 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny --locked check advisories bans licenses sources

  github_release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CRATE_NAME: givn
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false

      - name: Create GitHub release with repository changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$release_version" '
            index($0, "## [" version "]") == 1 {
              in_release = 1
              next
            }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > "$notes_file"
          if ! grep -q '^### ' "$notes_file"; then
            printf 'CHANGELOG.md has no release notes for %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "$RELEASE_TAG"
