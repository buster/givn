name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.9.0; omit to recover an existing tag"
        required: false
        type: string
      tag:
        description: "Existing annotated release tag to validate and publish"
        required: false
        type: string

concurrency:
  group: givn-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ inputs.version != '' }}
    outputs:
      release_tag: ${{ steps.record_release.outputs.release_tag }}
      release_commit: ${{ steps.record_release.outputs.release_commit }}
    runs-on: ubuntu-24.04
    env:
      CRATE_NAME: givn
      PRIMARY_BRANCH: main
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: givn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            givn-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pinned release tools
        id: toolcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/
          key: givn-release-tools-${{ runner.os }}-${{ runner.arch }}-cargo-release-1.1.4-git-cliff-2.13.1-cargo-audit-0.22.2-cargo-deny-0.20.2
          restore-keys: |
            givn-release-tools-${{ runner.os }}-${{ runner.arch }}-
            givn-security-tools-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify branch and clean source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$DISPATCH_REF" != "refs/heads/$PRIMARY_BRANCH" ]]; then
            printf 'release preparation must be dispatched from %s, got %s\n' \
              "$PRIMARY_BRANCH" "$DISPATCH_REF" >&2
            exit 1
          fi

          if [[ -n "$RECOVERY_TAG" ]]; then
            printf 'provide either the version or the tag input, not both\n' >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch --force --tags origin \
            "$PRIMARY_BRANCH:refs/remotes/origin/$PRIMARY_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/remotes/origin/$PRIMARY_BRANCH")" ]]; then
            printf '%s changed while this workflow was starting; retry from a current checkout\n' \
              "$PRIMARY_BRANCH" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            printf 'the release source checkout is not clean\n' >&2
            exit 1
          fi

      - name: Validate release version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'version must be a plain semantic version such as 0.9.0: %s\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          current_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"

          IFS=. read -r current_major current_minor current_patch <<<"$current_version"
          IFS=. read -r release_major release_minor release_patch <<<"$RELEASE_VERSION"
          if ((
            release_major < current_major ||
            (release_major == current_major && release_minor < current_minor) ||
            (release_major == current_major && release_minor == current_minor && release_patch <= current_patch)
          )); then
            printf 'release version %s must be newer than Cargo.toml version %s\n' \
              "$RELEASE_VERSION" "$current_version" >&2
            exit 1
          fi

          release_tag="v$RELEASE_VERSION"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          if git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            printf 'release tag already exists: %s\n' "$release_tag" >&2
            exit 1
          fi

          printf 'RELEASE_TAG=%s\nCURRENT_VERSION=%s\n' \
            "$release_tag" "$current_version" >> "$GITHUB_ENV"

      - name: Install pinned release tools
        shell: bash
        run: |
          set -euo pipefail

          install_archive() {
            url="$1"
            checksum_cmd="$2"
            checksum="$3"
            binary="$4"
            work="$(mktemp -d)"
            curl --fail --location --silent --show-error "$url" --output "$work/$binary.tar.gz"
            printf '%s  %s\n' "$checksum" "$work/$binary.tar.gz" | "$checksum_cmd" --check --status
            tar --extract --gzip --file "$work/$binary.tar.gz" --directory "$work"
            install --mode 0755 "$(find "$work" -type f -name "$binary" -print -quit)" \
              "$HOME/.cargo/bin/$binary"
            rm -rf "$work"
          }

          if ! cargo release --version 2>/dev/null | grep -Fq 'cargo-release 1.1.4'; then
            cargo install cargo-release --version 1.1.4 --locked
          fi
          if ! git-cliff --version 2>/dev/null | grep -Fq 'git-cliff 2.13.1'; then
            if [ "$(uname -m)" = x86_64 ]; then
              install_archive \
                "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz" \
                sha512sum \
                "e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30" \
                git-cliff
            else
              cargo install git-cliff --version 2.13.1 --locked
            fi
          fi
          if ! cargo audit --version 2>/dev/null | grep -Fq 'cargo-audit-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          if ! cargo deny --version 2>/dev/null | grep -Fq 'cargo-deny 0.20.2'; then
            if [ "$(uname -m)" = x86_64 ]; then
              install_archive \
                "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz" \
                sha256sum \
                "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f" \
                cargo-deny
            else
              cargo install cargo-deny --version 0.20.2 --locked
            fi
          fi

      - name: Save pinned release tools cache
        if: ${{ always() && steps.toolcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/
          key: givn-release-tools-${{ runner.os }}-${{ runner.arch }}-cargo-release-1.1.4-git-cliff-2.13.1-cargo-audit-0.22.2-cargo-deny-0.20.2

      - name: Verify release base
        run: scripts/release-guard.sh base "$CURRENT_VERSION"

      - name: Update Cargo manifest and lockfile
        run: cargo release version --execute --no-confirm --isolated --allow-branch "$PRIMARY_BRANCH" "$RELEASE_VERSION"

      - name: Verify Cargo versions
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          manifest_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"
          if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
            printf 'Cargo.toml version is %s, expected %s\n' \
              "$manifest_version" "$RELEASE_VERSION" >&2
            exit 1
          fi

          lock_version="$(awk '
            /^\[\[package\]\]$/ { in_givn = 0 }
            /^name = "givn"$/ { in_givn = 1; next }
            in_givn && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [[ "$lock_version" != "$RELEASE_VERSION" ]]; then
            printf 'Cargo.lock version is %s, expected %s\n' \
              "$lock_version" "$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Generate reviewed changelog
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname | awk 'NR == 1 { print; exit }')"
          if [[ -n "$latest_tag" ]]; then
            changelog_range="$latest_tag..HEAD"
          else
            baseline_commit=afe8d21
            git cat-file -e "$baseline_commit^{commit}"
            changelog_range="$baseline_commit..HEAD"
          fi

          generated_changelog="$RUNNER_TEMP/generated-changelog.md"
          git-cliff "$changelog_range" --tag "$RELEASE_TAG" \
            --output "$generated_changelog"

          python3 - "$generated_changelog" <<'PY'
          from pathlib import Path
          import re
          import sys

          changelog_path = Path("CHANGELOG.md")
          source = changelog_path.read_text()
          generated = Path(sys.argv[1]).read_text()
          unreleased = re.search(r"(?m)^## \[Unreleased\]\s*$", source)
          if unreleased:
              historical = re.search(
                  r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$",
                  source[unreleased.end():],
              )
              if historical is None:
                  raise SystemExit("CHANGELOG.md has no historical release baseline")
              historical_start = unreleased.end() + historical.start()
              historical_text = source[historical_start:]
          else:
              historical = re.search(
                  r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$", source
              )
              if historical is None:
                  raise SystemExit("CHANGELOG.md has no historical release baseline")
              historical_text = source[historical.start():]

          first_generated = re.search(
              r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$", generated
          )
          if first_generated is None:
              raise SystemExit("generated changelog has no release section")

          footer = re.search(
              r"(?m)^\[[^\]]+\]: https?://[^\n]+(?:\n|$)",
              generated[first_generated.start():],
          )
          if footer is None:
              release_text = generated[first_generated.start():].strip()
              footer_text = ""
          else:
              footer_start = first_generated.start() + footer.start()
              release_text = generated[first_generated.start():footer_start].strip()
              footer_text = generated[footer_start:].strip()

          output = (
              generated[:first_generated.start()].rstrip()
              + "\n## [Unreleased]\n\n"
              + release_text
              + "\n\n"
              + historical_text.strip()
          )
          if footer_text:
              output += "\n\n" + footer_text
          changelog_path.write_text(output + "\n")
          PY

          if ! grep -Eq "^## \[$RELEASE_VERSION\]($| - )" CHANGELOG.md; then
            printf 'generated changelog has no release heading for %s\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi

          scripts/release-guard.sh section "$RELEASE_VERSION" CHANGELOG.md

      - name: Install acceptance prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fossil

      - name: Install cargo-nextest
        uses: taiki-e/install-action@637df09687b2092ca3bdba3f1af641e2806e1356 # nextest

      - name: Run formatting and validation checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked --lib --no-tests=warn

      - name: Run repository acceptance suites
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh
          ./run-tests.sh --e2e

      - name: Run security checks
        run: |
          cargo audit
          cargo deny --locked check advisories bans licenses sources

      - name: Build release binary and verify CLI version
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin givn
          version_output="$(target/release/givn --version)"
          expected_output="$CRATE_NAME $RELEASE_VERSION"
          if [[ "$version_output" != "$expected_output" ]]; then
            printf 'givn --version returned %s, expected %s\n' \
              "$version_output" "$expected_output" >&2
            exit 1
          fi

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|CHANGELOG.md)
                ;;
              "")
                ;;
              *)
                printf 'unexpected release-preparation change: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          printf 'worktree before the release commit:\n'
          git status --porcelain --untracked-files=all || true
          tracked_leftovers="$(git status --porcelain --untracked-files=all |
            awk '$1 != "??" && $2 != "Cargo.toml" && $2 != "Cargo.lock" && $2 != "CHANGELOG.md"')"
          if [[ -n "$tracked_leftovers" ]]; then
            printf 'release preparation left unexpected tracked changes:\n%s\n' \
              "$tracked_leftovers" >&2
            exit 1
          fi
          untracked_leftovers="$(git status --porcelain --untracked-files=all | awk '$1 == "??"')"
          if [[ -n "$untracked_leftovers" ]]; then
            printf 'note: untracked files left by the preparation run; they are not part of the release commit:\n%s\n' \
              "$untracked_leftovers" >&2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): prepare $RELEASE_TAG"

      - name: Create and verify annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            printf 'release tag is not annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            printf 'release tag does not point to the release commit: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Record release identity
        id: record_release
        shell: bash
        run: |
          set -euo pipefail
          printf 'release_tag=%s\nrelease_commit=%s\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        shell: bash
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PUSH_TOKEN" ]]; then
            printf 'RELEASE_PUSH_TOKEN must be configured for release pushes\n' >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            push --atomic origin "$PRIMARY_BRANCH" "$RELEASE_TAG"

  release:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CRATE_NAME: givn
      PRIMARY_BRANCH: main
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag || inputs.tag }}
    steps:
      - name: Resolve release tag
        shell: bash
        env:
          PREPARED_TAG: ${{ needs.prepare.outputs.release_tag }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$PREPARED_TAG" && -z "$DISPATCH_TAG" ]]; then
            printf 'provide either the version or the tag input\n' >&2
            exit 1
          fi
          if [[ -n "$PREPARED_TAG" && -n "$DISPATCH_TAG" && "$PREPARED_TAG" != "$DISPATCH_TAG" ]]; then
            printf 'tag input %s conflicts with prepared release %s\n' \
              "$DISPATCH_TAG" "$PREPARED_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        shell: bash
        env:
          PREPARED_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "$PRIMARY_BRANCH:refs/remotes/origin/$PRIMARY_BRANCH"

          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            printf 'release tag must be annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -n "$PREPARED_COMMIT" && "$tag_commit" != "$PREPARED_COMMIT" ]]; then
            printf 'tag %s points to %s, but the prepared release commit is %s\n' \
              "$RELEASE_TAG" "$tag_commit" "$PREPARED_COMMIT" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$tag_commit" \
            "refs/remotes/origin/$PRIMARY_BRANCH"; then
            printf 'tag commit is not reachable from origin/%s\n' "$PRIMARY_BRANCH" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          manifest_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"
          if [[ "$manifest_version" != "$release_version" ]]; then
            printf 'tag version %s does not match Cargo.toml version %s\n' \
              "$release_version" "$manifest_version" >&2
            exit 1
          fi

          lock_version="$(awk '
            /^\[\[package\]\]$/ { in_givn = 0 }
            /^name = "givn"$/ { in_givn = 1; next }
            in_givn && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [[ "$lock_version" != "$release_version" ]]; then
            printf 'tag version %s does not match Cargo.lock version %s\n' \
              "$release_version" "$lock_version" >&2
            exit 1
          fi

          scripts/release-guard.sh section "$release_version" CHANGELOG.md

          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Create GitHub release with repository changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release %s already exists; nothing to do\n' "$RELEASE_TAG"
            exit 0
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$RELEASE_VERSION" '
            index($0, "## [" version "]") == 1 {
              in_release = 1
              next
            }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > "$notes_file"
          if ! grep -q '^### ' "$notes_file"; then
            printf 'CHANGELOG.md has no release notes for %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "$RELEASE_TAG"
