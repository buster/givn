name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: givn-cargo-${{ runner.os }}-${{ runner.arch }}-lt1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            givn-cargo-${{ runner.os }}-${{ runner.arch }}-lt1-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@637df09687b2092ca3bdba3f1af641e2806e1356 # nextest

      - name: Run library tests
        run: cargo nextest run --locked --lib --no-tests=warn

      - name: Install acceptance prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fossil git-filter-repo

      - name: Cache pinned test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/
          key: givn-test-tools-${{ runner.os }}-${{ runner.arch }}-git-cliff-2.13.1

      - name: Install pinned git-cliff for the changelog scenarios
        shell: bash
        run: |
          set -euo pipefail
          if ! git-cliff --version 2>/dev/null | grep -Fq 'git-cliff 2.13.1'; then
            cargo install git-cliff --version 2.13.1 --locked
          fi

      - name: Run repository acceptance suites
        run: |
          set -euo pipefail
          ./run-tests.sh
          ./run-tests.sh --e2e
