[project]
name = "givn-harness"
version = "0.1.0"
description = "Automated end-to-end test harness for givn's AI-agent-facing assets"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4",
    "behave>=1.3",
    "sandlock",
]

[project.scripts]
givn-harness = "givn_harness.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.behave]
use_nested_step_modules = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sandlock = { git = "https://github.com/multikernel/sandlock", rev = "6a4ec66", subdirectory = "python/" }

[dependency-groups]
dev = [
    "coverage>=7.15.2",
]
