[package]
name = "givn"
version = "0.1.0"
edition = "2024"
description = "A single-binary, Gherkin-first spec-driven workflow tool"
license = "TBD"
repository = "https://github.com/TBD/givn"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
rust-embed = "8.11"
gherkin = "0.16"
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
