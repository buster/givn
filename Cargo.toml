[package]
name = "givn"
version = "0.2.0"
edition = "2024"
description = "A single-binary, Gherkin-first spec-driven workflow tool"

license = "MIT OR Apache-2.0"
repository = "https://github.com/TBD/givn"


[lib]
path = "src/lib.rs"

[features]
default = []
spec-retrieval = ["dep:fastembed", "dep:ndarray", "dep:ort", "dep:tokenizers"]
spec-similarity-gate = ["spec-retrieval"]
cross-encoder-reranker = ["spec-retrieval"]
nli-evidence = ["spec-retrieval"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
rust-embed = "8.11"
gherkin = "0.16"
anyhow = "1.0"
thiserror = "2.0"
quick-xml = { version = "0.37", features = ["serialize"] }
fastembed = { version = "=5.17.2", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ndarray = { version = "=0.17.2", optional = true, default-features = false }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["api-24", "download-binaries", "ndarray", "std", "tls-rustls"] }
tokenizers = { version = "=0.22.2", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Cucumber test binary: runs the .feature files under givn/specs/ as the
# executable spec (harness=false so cucumber owns the output, not libtest).
[[test]]
name = "features_runner"
harness = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
