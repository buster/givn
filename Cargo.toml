[package]
name = "givn"
version = "0.9.1"
edition = "2024"
description = "A single-binary, Gherkin-first spec-driven workflow tool"

# Text givn generates carries an additional permission;
# see README.md § License and the note at the end of LICENSE.
license = "GPL-3.0-or-later"
repository = "https://github.com/buster/givn"


[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
rust-embed = "8.11"
gherkin = "0.16"
anyhow = "1.0"
thiserror = "2.0"
quick-xml = { version = "0.42", features = ["serialize"] }
sha2 = "=0.11.0"

[features]
default = []

[dev-dependencies]
tempfile = "3"
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Cucumber test binary: runs the .feature files under givn/specs/ as the
# executable spec (harness=false so cucumber owns the output, not libtest).
[[test]]
name = "features_runner"
harness = false

[[test]]
name = "ready_fixture"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# Keep debug/installed build gating (`cfg!(debug_assertions)`) intact while
# shrinking the dev/test artifact footprint: line tables alone are enough for
# backtraces and for `cargo llvm-cov` source-based coverage.
[profile.dev]
debug = "line-tables-only"
